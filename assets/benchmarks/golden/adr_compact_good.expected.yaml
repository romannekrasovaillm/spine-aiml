# Эталон адверсариальной пары (замечание ревью «length bias», 2026-09-04).
# Компактный документ (2,7 КБ — короче adr_full), плотный по всем якорям:
# инвертирует корреляцию «длина ↔ качество» в наборе. Судья, штрафующий
# за краткость, обнаружит себя на этом документе.
rubric: adr_quality
scores:
  context: 5            # силы с цифрами (18% CPU), ограничение (бюджет закрыт), регламент, цена бездействия (сезон ×5)
  alternatives: 5       # 3 альтернативы + статус-кво, у каждого причина; условие пересмотра выбора названо
  negative_consequences: 5  # адресно (поддержка), конкретно (сутки vs 15 мин), митигация + принятие владельцем
  reversibility: 5      # категория + флаг + репетиция отката с датой и результатом
  status_discipline: 5  # Proposed до реализации, дата пересмотра и триггер (>50 спорных/сутки)
