# Эталон адверсариальной пары (замечание ревью «length bias», 2026-09-04).
# Самый ДЛИННЫЙ документ набора (5,7 КБ) — структурно полный,
# содержательно пустой: вода вместо сил, картонные варианты, нет минусов.
rubric: adr_quality
scores:
  context: 2            # проблема названа, но силы/цифры/цена бездействия — риторика
  alternatives: 2       # два картонных варианта без причин отказа; «остальные очевидно нежизнеспособны»; статус-кво не оценён
  negative_consequences: 1  # только плюсы; «риски минимальны и под контролем» — якорь 1
  reversibility: 1      # «полностью обратимо» без механизма — якорь 1 дословно
  status_discipline: 3  # статус и дата есть; пересмотра/expiry нет
