# Бенчмарк: устойчивый интеграционный слой AIGena → GigaChat API при отсутствии SLA (ADR многослойной защиты + NFR + риски).
name: gigachat_sla_resilience
description: Проектирование устойчивого интеграционного слоя между банковским продуктом и LLM API без SLA — проверяет владение паттернами resilience (rate limiting, retry, circuit breaker, очереди, кэш, fallback) и измеримые NFR деградации
system_prompt: >-
  Действуй в роли по системному промпту `architect` из библиотеки харнесса
  (assets/prompts/architect.md): ты — solution-архитектор банка в регулируемом
  контуре. Соблюдай дисциплину: решения фиксируются до реализации, лимиты,
  коды ошибок и поведение внешнего API не выдумываются (не уверен — помечай
  [ТРЕБУЕТ ПРОВЕРКИ]), ответ структурирован: решение / обоснование /
  отвергнутые альтернативы / риски / артефакты / следующий гейт.
task: |
  Контекст. AIGena — внутренний банковский продукт, построенный на GigaChat API
  (Сбер, внешний провайдер). У GigaChat API НЕТ SLA: под нагрузкой AIGena часто
  получает HTTP 429 (лимит одновременных потоков / rate limit) и периодические
  5xx; пользователи видят сбои генерации. Факты о зависимости: лимит юрлица —
  10 одновременных потоков; OAuth-токен живёт 30 минут (перезапрос POST /oauth);
  нативной идемпотентности нет (RqUID — только трассировка); ретраибельны только
  429/5xx/сетевые ошибки; есть младшие модели и пакетный режим /batches. Классы
  нагрузки: интерактив и пакетный (фоновые генерации, массовые классификации).
  429 и 5xx — штатные события, а не исключения: ретраи «в лоб» усугубляют 429
  (стаи ретраев), одиночный механизм не закрывает весь спектр сбоев.

  Задание. Спроектируй решение уровня solution architecture:
  1. ADR многослойной защиты по шаблону (Context/Decision/Alternatives/Consequences/
     Reversibility), слои строго в порядке прохождения запроса: (а) клиентский
     rate limiter (token bucket) ПОД лимитами вендора, чтобы 429 не возникал вовсе;
     (б) retry с backoff + jitter и бюджетом на цепочку (меньше таймаута вызывающей
     стороны, уважение Retry-After); (в) circuit breaker с half-open прогревом
     (retry ВНУТРИ CB); (г) очередь-leveller для пакетных нагрузок (202, TTL, DLQ);
     (д) кэш ответов cache-aside по хэшу нормализованного промпта с TTL; (е) fallback
     — младшая модель / заготовка с пометкой деградации / отложить в очередь;
     (ж) RED-метрики и алерт по burn-rate 429 (доля 429 > 20% за 5 мин, 10 мин).
  2. Альтернативы с причинами отказа: экспонировать 429 пользователю (status quo);
     только ретраи без лимитера (амплификация 429); очередь без CB (интерактив задерживается, при устойчивом сбое копится «мусор»).
  3. NFR с измеримыми целями: P99 латентности интерактива с учётом бюджета ретраев,
     допустимая деградация (какие сценарии в каком режиме живут), целевая доля 429
     после внедрения, метрики открытия CB как инцидента.
  4. Риски и митигации: калибровка лимитера под фактический тариф [ТРЕБУЕТ ПРОВЕРКИ],
     устаревание кэша и ПДн в нём, снижение качества fallback, смена лимитов вендора.
  Ответ — единый markdown-документ с четырьмя разделами.
rubric: solution_architecture
pass_threshold: 3.5
