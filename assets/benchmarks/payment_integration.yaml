# Бенчмарк: интеграция платёжного шлюза (C4 + 2 ADR + NFR с RTO/RPO).
name: payment_integration
description: Проектирование интеграции с внешним платёжным шлюзом — проверяет C4-моделирование, ADR-дисциплину и измеримые NFR в регулируемом платёжном контуре
system_prompt: >-
  Действуй в роли по системному промпту `architect` из библиотеки харнесса
  (assets/prompts/architect.md): ты — solution-архитектор банка в регулируемом
  контуре. Соблюдай дисциплину: решения фиксируются до реализации, версии
  технологий не выдумываются (не уверен — помечай [ТРЕБУЕТ ПРОВЕРКИ]),
  ответ структурирован: решение / обоснование / отвергнутые альтернативы /
  риски / артефакты / следующий гейт.
task: |
  Контекст. Банк «Северный» (12 млн активных клиентов, процессинг собственный,
  ядро на монолите 20+ лет) запускает приём онлайн-платежей на маркетплейсе-
  партнёре. Выбран внешний платёжный шлюз (PSP): авторизация карт 3-D Secure,
  холдирование/списание, возвраты, рекурренты. Картовые данные банк хранить
  не имеет права (PCI DSS scope минимизируется токенизацией на стороне PSP).
  Текущий ландшафт: мобильный банк и веб ходят через API Gateway (Kong);
  оркестрации платежей нет — каналы дергают ядро напрямую; шина событий
  (Kafka) внедрена год назад, используют два домена из восьми; уведомления —
  отдельный сервис с очередью. Регуляторика: 152-ФЗ (PII), КИИ (контур
  платежей — объект КИИ категории II), требования ЦБ к доступности
  розничных платежей. SLA маркетплейса: ответ на авторизацию p99 ≤ 1.5 с
  в пике 400 rps, доступность витрины 99.9%. Пиковая нагрузка сезонная:
  распродажи ×3. Возвраты — до 8% транзакций, SLA зачисления 1 час.
  Команда: 6 разработчиков, владелец домена платежей назначен, SRE общие.

  Задание. Спроектируй решение уровня solution architecture:
  1. C4-диаграмма контейнеров (mermaid, подмножество flowchart): существующие
     и новые контейнеры, стыки с протоколами, граница PCI/КИИ.
  2. Два ADR по шаблону (Context/Decision/Alternatives/Consequences/
     Reversibility): (а) где живёт оркестрация платежа — новый сервис
     vs модуль ядра; (б) токенизация и маршрутизация картовых операций.
  3. NFR с измеримыми целями: доступность, RTO/RPO (обоснуй RPO=0 или
     оспорь), latency-бюджет по сегментам цепочки, поведение при отказе PSP,
     идемпотентность списаний и возвратов.
  Ответ — единый markdown-документ с тремя разделами.
rubric: solution_architecture
pass_threshold: 3.5
tags:
  - integration
  - adr
  - nfr
  - c4
  - payments
