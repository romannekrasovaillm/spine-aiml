# Бенчмарк: brownfield-декомпозиция монолита ядра (reverse discovery + дельта-спека).
name: legacy_decomposition
description: Декомпозиция банковского монолита — проверяет честное reverse discovery (confidence/gaps), выделение первого контура и дельта-спецификацию brownfield-изменения
system_prompt: >-
  Действуй в роли по системному промпту `architect` из библиотеки харнесса
  (assets/prompts/architect.md), режим обследования — по промпту
  `reverse_discovery` (assets/prompts/reverse_discovery.md): код — единственная
  истина, каждое утверждение о текущем состоянии имеет confidence
  (high/medium/low), пробелы фиксируются явно, reverse-spec не заменяет
  владельца домена. Ничего не додумывай: недоступное — в gaps.
task: |
  Контекст. Ядро банка «Северный» — монолит 22 лет (PL/SQL + Java-модули,
  ~4 млн LOC), еженедельное окно релизов, ночные батчи закрытия дня.
  Внутри монолита смешаны: клиентский справочник, счета и проводки,
  кредитный конвейер, депозиты, комиссионный движок, отчётность.
  Документация покрывает ~30% модулей и местами врёт. Владельцы доменов
  есть, но перегружены; двое ключевых разработчиков уходят через 4 месяца.
  Боль: комиссионный движок — 240 правил в хранимых процедурах, меняется
  еженедельно, каждое изменение тестируется вручную 2 дня; правила
  переиспользуются кредитным конвейером через прямые вызовы процедур.
  Правление требует «ускорить вывод продуктов», ИТ предлагает начать
  декомпозицию именно с комиссионного контура. Данные: общая БД,
  межмодульные FK повсюду; аудит требует сохранить историю комиссий
  за 5 лет; отчётность читает таблицы комиссий напрямую.
  Известные факты можно считать подтверждёнными (high); всё, что не следует
  из контекста, — обязано попасть в gaps с предложением, что их закроет.

  Задание. Подготовь пакет brownfield-стартовой декомпозиции:
  1. Мини-карта reverse discovery комиссионного контура: что известно
     (с confidence), список gaps с владельцем закрытия, срок годности карты
     и триггеры пересборки.
  2. Граница выделяемого контура и стратегия сосуществования с монолитом
     (strangler fig или иная — обоснуй), поведение общей БД и FK.
  3. Дельта-спека первого изменения в формате ADDED / MODIFIED / REMOVED
     относительно текущей истины: первый измеримый шаг с ценностью,
     не требующий «большого взрыва».
  4. План отката первого шага и критерии, по которым его запускают.
  Ответ — единый markdown-документ с четырьмя разделами.
rubric: solution_architecture
pass_threshold: 3.5
tags:
