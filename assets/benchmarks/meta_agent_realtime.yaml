# Бенчмарк: real-time агент ответов архитектору над данными МЕТА ≤10 секунд (ADR + C4 + тайм-бюджет + fallback).
name: meta_agent_realtime
description: Проектирование LLM-агента над архитектурным репозиторием банка с жёстким тайм-бюджетом 10 секунд — проверяет выбор retrieval-архитектуры (read-model vs text-to-SQL), работу с зависимостью без SLA и проектирование деградации
system_prompt: >-
  Действуй в роли по системному промпту `architect` из библиотеки харнесса
  (assets/prompts/architect.md): ты — solution-архитектор банка в регулируемом
  контуре. Соблюдай дисциплину: решения фиксируются до реализации, факты о
  СУБД, векторных индексах и поведении внешнего LLM API не выдумываются
  (не уверен — помечай [ТРЕБУЕТ ПРОВЕРКИ]), ответ структурирован: решение /
  обоснование / отвергнутые альтернативы / риски / артефакты / следующий гейт.
task: |
  Контекст. МЕТА — внутренний цифровой архитектурный репозиторий банка: данные
  о системах, точках взаимодействия (ТчВ) и интеграционных взаимодействиях (ИВ):
  5+ связанных таблиц (системы, ТчВ, ИВ, протоколы, контракты, владельцы) с
  JOIN'ами. Нужен агент, отвечающий на вопросы архитектора по этим данным в
  real-time — СТРОГО не более 10 секунд. Техстек банка: СУБД Pangolin (сборка
  PostgreSQL, поддержка pgvector в банковской редакции — [ТРЕБУЕТ ПРОВЕРКИ]);
  LLM — GigaChat API без SLA (возможны 429 и 5xx: лимит юрлица 10 потоков,
  нативной идемпотентности нет). Примеры вопросов: «какие ИВ у системы X и
  через какие протоколы», «кто владелец ТчВ между X и Y», «что сломается при
  отказе системы Z». Данные обновляются нечасто; доступ к МЕТА (API/реплика/дамп) — открытый вопрос.

  Задание. Спроектируй решение уровня solution architecture:
  1. ADR по шаблону (Context/Decision/Alternatives/Consequences/Reversibility) с
     ключевыми решениями: (а) НЕ делать text-to-SQL/JOIN'ы по 5+ таблицам в рантайме —
     заранее денормализованная read-model (витрина «карточка ТчВ/ИВ») в Pangolin,
     обновляемая по расписанию/CDC; (б) двухканальный retrieval: точный поиск по
     идентификаторам/именам (SQL по витрине, миллисекунды) + семантический (bge-m3
     локально или GigaChat embeddings; pgvector или внешний векторный индекс —
     выбери и обоснуй); (в) LLM-слой: GigaChat с анти-429 защитой (лимитер + retry +
     CB) и cache-aside по нормализованному вопросу; (г) тайм-бюджет 10 с по этапам
     (retrieval ≤1 с, prompt-assembly ≤0.2 с, LLM ≤7 с, запас 1.8 с) и стратегия при
     превышении; (д) retrieval-only fallback: карточка без LLM — ответ ≤2 с; (е) freshness-NFR: лаг витрины (≤15 мин) в ответе.
  2. C4-диаграмма контейнеров (mermaid, подмножество flowchart): витрина, retrieval-
     сервис, LLM-шлюз с защитным слоем, кэш, загрузчик из МЕТА, стыки с протоколами.
  3. Альтернативы с вердиктами: прямой text-to-SQL по живым JOIN'ам (непредсказуемая
     латентность и качество SQL); LLM с function calling по живым таблицам (много ходов — не влезает в 10 с); локальная модель на GPU банка (отложено — [ТРЕБУЕТ ПРОВЕРКИ]).
  4. Открытые вопросы с владельцами: доступ к МЕТА; поддержка pgvector; кардинальность
     ТчВ/ИВ для выбора индекса; требования ИБ к выносу данных из МЕТА; доступные GPU.
  Ответ — единый markdown-документ с четырьмя разделами.
rubric: solution_architecture
pass_threshold: 3.5
