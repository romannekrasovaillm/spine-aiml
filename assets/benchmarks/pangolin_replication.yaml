# Бенчмарк: репликация СУБД Pangolin на вторую площадку при запрете стандартных механизмов (ADR + spine-инварианты + NFR).
name: pangolin_replication
description: Проектирование канала доставки данных Pangolin на второй ЦОД при запрете потоковой репликации и Patroni-standby — проверяет ADR-дисциплину, работу с RTO/RPO-классами альтернатив и формулировку инвариантов architecture-spine
system_prompt: >-
  Действуй в роли по системному промпту `architect` из библиотеки харнесса
  (assets/prompts/architect.md): ты — solution-архитектор банка в регулируемом
  контуре. Соблюдай дисциплину: решения фиксируются до реализации, версии
  технологий и факты о механизмах СУБД не выдумываются (не уверен — помечай
  [ТРЕБУЕТ ПРОВЕРКИ]), ответ структурирован: решение / обоснование /
  отвергнутые альтернативы / риски / артефакты / следующий гейт.
task: |
  Контекст. Банк эксплуатирует боевой кластер СУБД Pangolin (Platform V, СберТех —
  сборка PostgreSQL, НЕ MPP). Данные кластера нужны на второй площадке (другой ЦОД)
  для двух целей: отчётность (снять нагрузку чтения с боевого кластера) и DR
  (автономная копия при потере основного ЦОД). Стандартные механизмы НЕ работают:
  потоковая физическая репликация между ЦОД запрещена сетевой политикой ИБ (прямые
  DB-подключения между площадками закрыты, исключение не согласуется), Patroni-standby
  между площадками недоступен (та же политика + нет общего DCS-контура). Разрешённый
  транспорт между площадками — брокер сообщений. Факты о Pangolin: wal2json входит в
  состав продукта (логическое декодирование WAL в JSON; wal_level=logical с перезапуском;
  слоты репликации; смещение LSN после seed); нативных коннекторов Kafka нет; FDW —
  oracle_fdw/tds_fdw; pgcopydb (follow = CDC, суперюзер на приёмнике, не работает с
  TDE); pgloader — массовая загрузка COPY. В потоке могут быть ПДн (152-ФЗ).

  Задание. Спроектируй решение уровня solution architecture:
  1. ADR по шаблону (Context/Decision/Alternatives/Consequences/Reversibility) с
     четырьмя альтернативами: (а) CDC wal2json → брокер → идемпотентный апплаер на
     второй площадке; (б) периодические снапшоты pgcopydb/pgloader по расписанию;
     (в) FDW-прилинковка (чтение с боевого кластера по требованию); (г) файловая
     выгрузка COPY → транспорт → загрузка. Для КАЖДОЙ альтернативы укажи RTO/RPO-класс,
     ограничения и честную причину принятия/отказа; выбор обоснуй под ограничения
     банка (ИБ-политика, автономность DR-копии, лаг для отчётности).
  2. 2–3 spine-инварианта в формате Binds/Prevents/Rule (запрет прямых подключений
     потребителей к боевой БД; идемпотентность апплаера при at-least-once доставке;
     мониторинг лага CDC с порогом алерта) — Rule проверяемым (fitness-правилом).
  3. NFR с измеримыми целями: целевые RPO/RTO, порог лага CDC и алертинг, контроль
     роста WAL при недоступном приёмнике, требования к шифрованию CDC-потока с ПДн.
  4. Раздел «Открытые вопросы к уточнению» — каждый вопрос с владельцем (какой брокер
     в банке; пропускная wal2json под нагрузкой; допустимый бизнесом RPO; wal2json+TDE — [ТРЕБУЕТ ПРОВЕРКИ]).
  Ответ — единый markdown-документ с четырьмя разделами.
rubric: solution_architecture
pass_threshold: 3.5
