# Бенчмарк: event-driven интеграция двух доменов (consistency model, идемпотентность).
name: event_driven_design
description: Проектирование событийной интеграции доменов «Кредиты» и «Уведомления/Маркетинг» — проверяет контракты событий, модель согласованности, идемпотентность и деградацию
system_prompt: >-
  Действуй в роли по системному промпту `architect` из библиотеки харнесса
  (assets/prompts/architect.md): ты — solution-архитектор банка. Событийные
  контракты, модели согласованности и деградация — архитектурные решения:
  фиксируй их явно, с обоснованием и отвергнутыми альтернативами; версии
  технологий не выдумывай — помечай [ТРЕБУЕТ ПРОВЕРКИ].
task: |
  Контекст. В банке «Северный» домен «Кредиты» (кредитный конвейер:
  заявка → скоринг → решение → выдача) и домен «Клиентские коммуникации»
  (уведомления push/SMS/email, маркетинговые кампании) развивались
  независимо. Сейчас коммуникации о статусах заявки работают через
  ночной батч-обмен файлами: клиент узнаёт об одобрении кредита утром,
  NPS падает, колл-центр перегружен звонками «что с моей заявкой»
  (до 30% входящих). Решение сверху: перевести взаимодействие на события
  через корпоративную шину (Kafka-совместимая, внедрена год назад).
  Ограничения: PII в событиях минимизировать (152-ФЗ); шина — общая
  на 8 доменов, кластер не резиновый; в «Кредитах» релизы раз в 2 недели,
  в «Коммуникациях» — ежедневно; уведомление клиенту об одобрении —
  регуляторно значимое (нельзя потерять, нельзя продублировать SMS
  о выдаче денег); маркетинговые события терпимы к потере до 5%.
  Пики: рекламные кампании дают всплеск заявок ×5 на час.
  Оба домена имеют своих владельцев и отдельные команды.

  Задание. Спроектируй событийную интеграцию:
  1. Каталог событий первого релиза (3–5 событий): схема, владелец,
     класс критичности, политика PII; что является фактом, а что —
     производным сигналом.
  2. Модель согласованности на каждом стыке: strong vs eventual с окном,
     компенсации; обоснование выбора для критичных и маркетинговых классов.
  3. Идемпотентность: сквозные идентификаторы, дедупликация, поведение
     при дублях и переупорядочивании; семантика at-least-once против
     exactly-once — с причиной.
  4. Деградация: поведение при падении шины, медленном консьюмере,
     всплеске ×5; что деградирует первым, что не деградирует никогда.
  Ответ — единый markdown-документ с четырьмя разделами.
rubric: solution_architecture
pass_threshold: 3.5
tags:
