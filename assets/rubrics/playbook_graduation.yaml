# Судейская рубрика готовности playbook к градации в Agent Skill
# (spec §5.3): оценивает семантику, которую не выразить regex'ом, — её
# применяет человек/eval-судья ПЕРЕД подтверждением градации. Механический
# предикат (тип, порог `uses`, равенство `steps_sha256`) живёт в
# `control::playbook_graduation_violations` и рубрику не дублирует.
# Секция `thresholds` — ориентир для судьи/человека; харнесс берёт порог
# разброса из секции `[judge]` конфига (`unstable_stdev`).
# Источник: library/distillate/1_методология/концепт-playbook — роль между
# дистиллятом и скиллом.md
name: playbook_graduation
description: >-
  Готовность playbook стать Agent Skill: процедура повторялась, перестала
  меняться и обобщается за пределы одного случая.
scale_max: 5
origin: anchor
criteria:
  - id: repeatability
    name: Повторяемость триггера
    weight: 2
    description: "Задача-триггер конкретна и встречается регулярно, а не единожды."
    anchors:
      1: "разовый случай"
      3: "повторится ещё раз"
      5: "регулярная задача класса"
  - id: stability
    name: Устойчивость шагов
    weight: 2
    description: "Шаги не менялись между применениями (сверять с журналом steps_sha256)."
    anchors:
      1: "шаги переписаны"
      3: "мелкие правки"
      5: "шаги идентичны"
  - id: generality
    name: Обобщаемость
    weight: 1
    description: "Процедура переносима на другие случаи, а не сшита под один прогон."
    anchors:
      1: "один случай"
      3: "узкое семейство"
      5: "широкий класс задач"
  - id: procedure_shape
    name: Форма процедуры
    weight: 1
    description: "Есть нумерованная методика из ≥3 шагов, а не пересказ теории."
    anchors:
      1: "нарратив"
      3: "частичные шаги"
      5: "чёткая пошаговая методика"
thresholds:
  min_total: 4.0
  unstable_stdev: 1.0
