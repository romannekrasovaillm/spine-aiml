# Рубрика качества датасета (домен: data-curator, подготовка датасетов;
# уроки из памяти — PyArrow struct, data_source префикс, утечка, дедупликация).
# Оценивает ДАТАСЕТ как артефакт: схема, дедупликация, утечка, покрытие,
# версионирование, приватность, сплиты, происхождение. Сумма весов: 100.
name: dataset_quality
description: "Качество датасета: единая схема, дедупликация, отсутствие утечки, покрытие домена, версионирование и пиннинг, приватность, корректные сплиты, прослеживаемое происхождение"
scale_max: 5
origin: anchor
criteria:
  - id: schema_consistency
    name: Единая схема
    description: "Единый формат и схема записей (напр. PyArrow struct для reward-модели); поля типизированы; битые записи отфильтрованы"
    weight: 14
    anchors:
      1: "Формат произвольный: JSON, текст и бинарь вперемешку; схема не определена, битые записи падают в прогоне"
      3: "Схема есть, но не типизирована; валидация частичная, битые записи не отфильтрованы до прогона"
      5: "Единая типизированная схема (PyArrow struct), валидация до прогона, битые записи отфильтрованы и посчитаны"
  - id: dedup
    name: Дедупликация
    description: "Точные и near-дубли удалены; дубликаты между train и test исключены; объём после дедупа измерен"
    weight: 14
    anchors:
      1: "Дупликаты не удалены; одни и те же примеры встречаются в train и test"
      3: "Точные дубли удалены, но near-дубли не искались; объём дедупа не измерен"
      5: "Точные и near-дубли удалены, train/test пересечение проверено, доля удалённого измерена"
  - id: leakage
    name: Отсутствие утечки
    description: "Нет утечки между сплитами и между датасетом и бенчмарком; будущее не протекает в прошлое (time-based)"
    weight: 14
    anchors:
      1: "Утечка очевидна: примеры бенчмарка в train, либо сплиты пересекаются"
      3: "Сплиты изолированы, но бенчмарк-контаминация не проверена; временная утечка не исключена"
      5: "Сплиты и бенчмарк проверены на пересечение; для time-based задач граница по времени соблюдена"
  - id: coverage_balance
    name: Покрытие и баланс
    description: "Датасет покрывает целевой домен (не только частотные случаи); дисбаланс классов/длин осознан и компенсирован"
    weight: 12
    anchors:
      1: "Покрытие узкое: только частотные случаи; дисбаланс не замечен"
      3: "Покрытие частичное; дисбаланс измерен, но не компенсирован"
      5: "Покрытие домена проверено (редкие случаи включены); дисбаланс измерен и обработан (веса/сэмплирование)"
  - id: versioning_pinning
    name: Версионирование и пиннинг
    description: "Датасет пиннут версией/хэшем; data_source префикс; изменения датасета отслеживаемы"
    weight: 12
    anchors:
      1: "Датасет не версионирован: правится на месте, хэша нет, изменения неотслеживаемы"
      3: "Версия есть, но пиннинг не enforced; data_source префикс не везде"
      5: "Датасет пиннут версией/хэшем, data_source префикс, каждое изменение — новая версия с дельтой"
  - id: privacy_license
    name: Приватность и лицензии
    description: "Чувствительные данные не покидают приватный периметр; PII вычищено; лицензии данных соблюдены"
    weight: 12
    anchors:
      1: "PII в данных; лицензии не проверены; данные утекают во внешний API"
      3: "Лицензии частично проверены, но PII не вычищено; периметр не enforced"
      5: "PII вычищено/псевдонимизировано, лицензии проверены, данные не покидают периметр (ML-01/ML-03)"
  - id: splits
    name: Корректные сплиты
    description: "Train/val/test разделены до обработки, стратификация по ключевым осям, val не подгоняется под test"
    weight: 11
    anchors:
      1: "Сплиты случайны без стратификации; val переиспользуется как test"
      3: "Сплиты есть, но стратификация не продумана; val/test не полностью разделены"
      5: "Сплиты стратифицированы по ключевым осям, разделены до обработки, val изолирован от test"
  - id: provenance
    name: Происхождение и аудит
    description: "Источник каждой записи известен; изменения данных аудируемы; можно восстановить, откуда пришёл пример"
    weight: 11
    anchors:
      1: "Происхождение неизвестно: данные взяты «откуда-то», аудита нет"
      3: "Источник известен частично; история изменений не ведётся"
      5: "Каждая запись прослеживается до источника; изменения данных в журнале, восстановление возможно"
