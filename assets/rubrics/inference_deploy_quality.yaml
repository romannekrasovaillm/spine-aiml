# Рубрика качества inference/развёртывания (домен: inference, inference-engines,
# 01_СРЕДЫ; уроки памяти — vLLM/vLLM ABI, gpu_memory_utilization, OOM).
# Оценивает РАЗВЁРТЫВАНИЕ модели на инференс: движок, batching, latency,
# память GPU, версионирование, деградацию, мониторинг, приватность. Сумма: 100.
name: inference_deploy_quality
description: "Качество развёртывания инференса: выбор движка, batching и throughput, latency-бюджет, память GPU, версионирование модели, деградация с fallback, мониторинг и приватный периметр"
scale_max: 5
origin: anchor
criteria:
  - id: engine_choice
    name: Выбор движка
    description: "Движок (vLLM/TensorRT-LLM/Ollama/…) выбран под задачу и модель; ABI/совместимость сверены; деградация производительности осознана"
    weight: 14
    anchors:
      1: "Движок выбран по наитию; ABI/совместимость не проверены, падение производительности не осознано"
      3: "Движок обоснован, но совместимость не сверена; fallback-путь не продуман"
      5: "Движок выбран под модель/задачу, ABI и совместимость сверены, известные деградации учтены"
  - id: batching_throughput
    name: Batching и throughput
    description: "Batching и параллелизм настроены под нагрузку; throughput измерен; trade-off с latency осознан"
    weight: 14
    anchors:
      1: "Batching не настроен; throughput неизвестен, latency страдает"
      3: "Batching есть, но не оптимизирован; trade-off throughput/latency не измерен"
      5: "Batching/параллелизм подобраны под профиль нагрузки; throughput и latency измерены, trade-off явный"
  - id: latency_budget
    name: Бюджет latency
    description: "p99 latency в бюджете; таймауты и ретраи заданы; деградация при превышении — штатный режим"
    weight: 13
    anchors:
      1: "Latency не измеряется; таймаутов нет; при перегрузке — 5xx наружу"
      3: "p99 измеряется, но бюджет не задан; таймауты частичные"
      5: "p99 в бюджете, таймауты и ретраи заданы, деградация при превышении — штатная с метрикой"
  - id: memory_gpu
    name: Память GPU
    description: "VRAM посчитан (веса ×2 + overhead); gpu_memory_utilization настроен; OOM предотвращён"
    weight: 13
    anchors:
      1: "VRAM не посчитан; OOM случается; gpu_memory_utilization по дефолту"
      3: "VRAM оценён грубо; OOM не исключён; утилизация не настроена под модель"
      5: "VRAM посчитан по формуле (веса ×2 + overhead), gpu_memory_utilization настроен, OOM предотвращён"
  - id: versioning_registry
    name: Версионирование и реестр
    description: "Модель пиннута версией/хэшем в реестре; откат на прежнюю версию возможен; воспроизводимость выдачи"
    weight: 12
    anchors:
      1: "Модель не версионируется; выдачу нельзя воспроизвести; откат невозможен"
      3: "Версия есть, но не в реестре; откат ручной, воспроизводимость частичная"
      5: "Модель пиннута версией/хэшем в реестре, откат и A/B между версиями возможны, выдача воспроизводима"
  - id: fallback_degradation
    name: Деградация и fallback
    description: "При недоступности модели — детерминированный fallback (правило/кэш/отказ с кодом), не каскадный отказ"
    weight: 12
    anchors:
      1: "При сбое модели — каскадный отказ; fallback нет; вызывающий сервис блокируется"
      3: "Fallback есть, но не детерминированный; поведение при сбое не определено"
      5: "Детерминированный fallback (правило/кэш/явный отказ); деградация штатная с метрикой, не 5xx наружу"
  - id: monitoring
    name: Мониторинг
    description: "Метрики (latency, throughput, ошибки, дрейф) собираются; наблюдаемость для инцидента; алерты"
    weight: 11
    anchors:
      1: "Метрик нет; инцидент обнаруживается по жалобам; наблюдаемости нет"
      3: "Метрики частично есть, но дрейф не отслеживается; алертов нет"
      5: "Метрики (latency/throughput/ошибки/дрейф) собраны, алерты настроены, инцидент локализуется"
  - id: security_privacy
    name: Безопасность и приватность
    description: "Приватный периметр: входы не логируются с PII, модель не покидает контур, доступ ограничен"
    weight: 11
    anchors:
      1: "PII логируется в открытом виде; модель/данные доступны вне периметра"
      3: "Периметр частичный; PII в логах не вычищено; доступ не ограничен"
      5: "PII не персистится/не логируется, модель в периметре, доступ по политике; утечка исключена"
