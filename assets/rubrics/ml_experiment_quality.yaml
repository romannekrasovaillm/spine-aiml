# Рубрика качества ML-эксперимента (домен: 10_Проекты_и_отчёты, experiment-tools,
# automated-research, качество отчётов recipes_taxonomy).
# Оценивает ДИЗАЙН эксперимента до прогона и ЧЕСТНОСТЬ отчёта после —
# против самообмана «запустил → значит результат». Сумма весов: 100.
name: ml_experiment_quality
description: "Качество ML-эксперимента: гипотеза и метрика до запуска, честный baseline, воспроизводимость, абляция, контроль утечки, бюджет compute и честность отчёта"
scale_max: 5
origin: anchor
criteria:
  - id: hypothesis_metric
    name: Гипотеза и метрика успеха
    description: "Гипотеза и метрика успеха зафиксированы ДО запуска; метрика измерима и отделена от процесса"
    weight: 12
    anchors:
      1: "Метрики нет или она выбрана постфактум под результат; гипотеза не сформулирована"
      3: "Метрика есть, но не отделена от реализации (обучение без валидационного гейта); гипотеза размыта"
      5: "Гипотеза сформулирована, метрика успеха определена до запуска и проверяется независимо от самого прогона"
  - id: baseline
    name: Честный baseline
    description: "Сравнение с базой: zero-shot, прежний SOTA, SFT-модель или предыдущая версия пайплайна; рост приписан методу, а не случайности"
    weight: 12
    anchors:
      1: "Baseline нет; результат подаётся как абсолютное достижение без точки отсчёта"
      3: "Baseline есть, но не сравним (другое железо/данные/случайные сиды); сравнение нечестное"
      5: "Baseline воспроизводим и сравним по тем же условиям; вклад метода отделён от прочих факторов"
  - id: reproducibility
    name: Воспроизводимость
    description: "Сиды, окружение, версии библиотек, пиннинг весов/данных; запуск воспроизводим сторонним"
    weight: 14
    anchors:
      1: "Ни сидов, ни версий, ни данных — результат невозможно повторить"
      3: "Сиды и версии частично зафиксированы, но окружение/данные не пиннуты; повторение требует угадывания"
      5: "Полный рецепт: пиннутые версии, окружение, сиды, хэши данных и чекпоинтов; сторонний воспроизводит результат"
  - id: data_hygiene
    name: Гигиена данных
    description: "Сплиты без утечки, версии датасета, дедупликация, приватный периметр (данные не покидают контур)"
    weight: 10
    anchors:
      1: "Train/test не разделены или утечка очевидна; версий данных нет"
      3: "Сплиты есть, но утечка не проверена; датасет версионирован частично"
      5: "Сплиты изолированы и проверены на утечку; датасет пиннут хэшем/версией; чувствительные данные не покидают контур"
  - id: ablation
    name: Абляция и изоляция переменной
    description: "Одна переменная за прогон; контрольная группа; вклад каждой компоненты измерен"
    weight: 10
    anchors:
      1: "Всё сразу: множество изменений в одном прогоне, вклад каждой неотделим"
      3: "Изменения сгруппированы, но не по одной переменной; контрольной группы нет"
      5: "Каждый прогон меняет одну переменную с контрольной группой; вклад компонент измерен отдельно"
  - id: eval_gap
    name: Разрыв train/eval
    description: "Честная оценка обобщения: валидация на отложенных данных, отсутствие подгонки под eval, бенчмарк-контаминация"
    weight: 10
    anchors:
      1: "Оценка на train-данных или подгонка под eval; переобучение не замечено"
      3: "Eval отделён, но бенчмарк-контаминация не проверена; разрыв train/eval не измерен"
      5: "Валидация на отложенных данных, бенчмарк-контаминация проверена, разрыв train/eval измерен и объяснён"
  - id: compute_budget
    name: Бюджет compute
    description: "Оценка VRAM/времени до запуска, выбор GPU под задачу, стоимость прогона, избежание OOM"
    weight: 8
    anchors:
      1: "Бюджет не оценён; OOM и таймауты случаются по ходу; стоимость неизвестна"
      3: "Бюджет оценён грубо; железо выбрано без сверки VRAM модели ×2 + overhead"
      5: "VRAM/время/стоимость оценены до запуска по формуле; GPU выбран под модель; OOM предотвращён"
  - id: failure_modes
    name: Предсказанные режимы отказа
    description: "Режимы отказа предсказаны до запуска, мониторинг (энтропия, градиенты, коллапс) на каждом шаге"
    weight: 8
    anchors:
      1: "Режимы отказа не предсказаны; прогон падает без диагностики"
      3: "Мониторинг есть, но ключевые сигналы (энтропия, градиенты) не отслеживаются"
      5: "Режимы отказа перечислены, сигналы мониторятся на каждом шаге, пороги срабатывания заданы заранее"
  - id: result_honesty
    name: Честность отчёта
    description: "Отрицательные результаты зафиксированы, что НЕ сработало названо явно, выводы не преувеличены"
    weight: 8
    anchors:
      1: "Отчёт только о успехах; отрицательные результаты скрыты или переиначены"
      3: "Неудачи упомянуты, но не систематизированы; выводы завышены относительно данных"
      5: "Отрицательные результаты — первоклассный вывод; что не сработало и почему — названо явно, выводы соразмерны данным"
  - id: next_step_gate
    name: Гейт следующего шага
    description: "Критерий готовности к следующему шагу (масштабирование, публикация, прод) определён; что остаётся открытым"
    weight: 8
    anchors:
      1: "Нет критерия готовности; следующий шаг решается по настроению"
      3: "Критерий есть, но не проверяем; открытые вопросы не перечислены"
      5: "Гейт готовности проверяем (метрика/порог); открытые вопросы и риски следующего шага перечислены"
