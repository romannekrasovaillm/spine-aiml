# Рубрика качества дистилляции (домен: distillation-плагины, 02_МИД-ТРЕЙНИНГ).
# Оценивает ПЛАН дистилляции: выбор учителя, данные, loss-дизайн, что именно
# переносится, оценка относительно учителя, обобщение, выигрыш, воспроизводимость.
# Сумма весов: 100.
name: distillation_quality
description: "Качество дистилляции: выбор учителя, покрытие данных, дизайн loss (KL/temperature), перенос способности а не формы, оценка относительно учителя, обобщение, выигрыш compute и воспроизводимость"
scale_max: 5
origin: anchor
criteria:
  - id: teacher_selection
    name: Выбор учителя
    description: "Учитель выбран по сильным сторонам для целевой способности; ограничения учителя известны; версия зафиксирована"
    weight: 14
    anchors:
      1: "Учитель выбран «потому что большой»; сильные стороны и ограничения не оценены"
      3: "Учитель обоснован, но версия не зафиксирована; ограничения не названы"
      5: "Учитель выбран под целевую способность, сильные стороны и ограничения названы, версия пиннута"
  - id: data_coverage
    name: Покрытие данных
    description: "Данные дистилляции покрывают целевые способности; включают hard-кейсы, а не только лёгкие примеры"
    weight: 14
    anchors:
      1: "Данные случайны/лёгкие; целевые способности не покрыты, hard-кейсов нет"
      3: "Данные частично покрывают цель; hard-кейсы недопредставлены"
      5: "Данные покрывают целевые способности с hard-кейсами; объём и распределение обоснованы"
  - id: loss_design
    name: Дизайн loss
    description: "KL/temperature и сочетание с SFT-целью подобраны; стабильность обучения обеспечена"
    weight: 13
    anchors:
      1: "Loss не продуман: дефолтный KL без temperature; обучение нестабильно"
      3: "KL/temperature есть, но не обоснованы; сочетание с SFT не настроено"
      5: "KL с обоснованной temperature, сочетание с SFT-целью настроено; стабильность проверена"
  - id: objective_alignment
    name: Перенос способности, не формы
    description: "Дистиллируется способность (умение решать), а не форма (повторение формулировок); не копируются ошибки учителя"
    weight: 13
    anchors:
      1: "Студент копирует форму/формулировки, а не способность; наследует ошибки учителя"
      3: "Цель — способность, но ошибки учителя не отфильтрованы; перенос формы не разграничен"
      5: "Целевая способность явно отделена от формы; ошибки учителя отфильтрованы, способность переносится"
  - id: eval_gap_teacher
    name: Оценка относительно учителя
    description: "Дельта к учителю измерена (студент vs учитель на том же наборе); целевой разрыв задан заранее"
    weight: 12
    anchors:
      1: "Студент не сравнен с учителем; качество оценивается в отрыве от источника сигнала"
      3: "Сравнение есть, но не на том же наборе/метрике; целевой разрыв не задан"
      5: "Студент и учитель оценены на одном наборе одной метрикой; целевой разрыв задан заранее и проверен"
  - id: generalization
    name: Обобщение
    description: "Студент не переобучен под учителя: качество держится за пределами дистилляционного набора"
    weight: 12
    anchors:
      1: "Студент повторяет учителя только на дистилляционных данных; на новом проваливается"
      3: "Обобщение проверено частично; разрыв на отложенных данных не измерен"
      5: "Качество подтверждено на отложенных данных за пределами набора дистилляции; переобучение исключено"
  - id: compute_efficiency
    name: Выигрыш compute
    description: "Выигрыш (размер/латентность/стоимость) относительно учителя измерен; оправдывает затраты на дистилляцию"
    weight: 11
    anchors:
      1: "Выигрыш не измерен; дистилляция дороже, чем обучение с нуля, но это не осознано"
      3: "Выигрыш оценён грубо; сравнение с обучением с нуля не сделано"
      5: "Выигрыш (размер/скорость/цена) измерен против учителя и против обучения с нуля; дистилляция оправдана"
  - id: reproducibility
    name: Воспроизводимость
    description: "Рецепт дистилляции воспроизводим: данные, версии учителя/студента, loss-параметры, сиды зафиксированы"
    weight: 11
    anchors:
      1: "Рецепт не зафиксирован; повторить дистилляцию невозможно"
      3: "Часть параметров зафиксирована; данные/версии не пиннуты"
      5: "Полный рецепт: пиннутые версии учителя/студента, данные, loss-параметры, сиды; сторонний воспроизводит"
