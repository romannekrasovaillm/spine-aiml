name: agents_md_quality
description: Качество AGENTS.md репозитория как канала архитектурного контроля — точность команд, покрытие инвариантов, стоп-условия эскалации, свежесть, отсутствие заглушек
scale_max: 5
origin: anchor
criteria:
  - id: commands_accuracy
    name: Точность команд
    description: Команды сборки/тестов/линта реально существуют и запускаются (манифесты, CI)
    weight: 8
    anchors:
      1: Команды выдуманы или устарели (запуск падает)
      3: Команды в основном верны, часть не проверена
      5: Каждая команда выводится из манифеста/CI и проверена запуском
  - id: invariants_coverage
    name: Покрытие инвариантов
    description: Инварианты spine и запреты CONSTRAINTS перенесены с проверяемыми правилами
    weight: 10
    anchors:
      1: Инвариантов нет или они не совпадают со spine
      3: Часть инвариантов, без проверяемых правил
      5: Все инварианты AD-n с Rule, запреты со ссылкой на fitness-проверку
  - id: escalation_rules
    name: Стоп-условия эскалации
    description: Явные условия, при которых агент/разработчик обязан остановиться и эскалировать архитектору
    weight: 9
    anchors:
      1: Стоп-условий нет — агент решает архитектурные вопросы молча
      3: Общие слова («спросите архитектора при сложностях»)
      5: Конкретные триггеры (API/data contract, security boundary, необратимость…) с маршрутом оценки
  - id: freshness
    name: Свежесть и воспроизводимость
    description: Файл сгенерирован из источников, есть детекция дрейфа, дата генерации
    weight: 7
    anchors:
      1: Рукописный, устаревший, источники неизвестны
      3: Есть дата, но дрейф не детектируется
      5: Сгенерированная зона с хэшем входов; lint подтверждает свежесть
  - id: signal_to_noise
    name: Сигнал/шум
    description: 60–150 строк, без простыней и дублей выводимого из кода
    weight: 4
    anchors:
      1: Простыня >300 строк или пустая оболочка
      3: Читаемо, но с водой и дублями кода
      5: Каждая строка меняет поведение читателя; ссылки вместо копий
