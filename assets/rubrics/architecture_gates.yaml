# Рубрика прохождения архитектурных гейтов A0–A5 (docs/SOURCE_BRIEF.md §C.3).
# Оценивает, выстроены ли в пакете изменения контрольные точки и их доказательства.
name: architecture_gates
description: "Полнота и качество контрольных точек A0–A5 в архитектурном пакете изменения (fit → impact → trigger → human decision → evidence → drift)"
scale_max: 5
origin: anchor
criteria:
  - id: a0_architecture_fit
    name: A0 — Architecture Fit
    description: "Автоматическая проверка укладки в утверждённые паттерны/constitution; если вне паттерна — зафиксировано исключение"
    weight: 1
    anchors:
      1: "Укладка в паттерны не проверялась; неизвестно, исключение это или норма"
      3: "Паттерн назван, но проверка соответствия декларативна, без перечня применимых паттернов"
      5: "Указан конкретный утверждённый паттерн и доказана укладка, либо оформлено architecture exception с обоснованием и сроком"
  - id: a1_impact_assessment
    name: A1 — Impact Assessment
    description: "Оценка влияния: затронутые системы, домены, данные, владельцы; blast radius изменения"
    weight: 2
    anchors:
      1: "Влияние не оценено; blast radius неизвестен"
      3: "Затронутые системы перечислены, но без владельцев и оценки blast radius"
      5: "Полная карта влияния: системы, владельцы, данные, blast radius (кто пострадает при отказе), оценка стоимости изменения"
  - id: a2_solutioning_trigger
    name: A2 — Solutioning Trigger
    description: "Порог запуска полного Solutioning задан человеком заранее; срабатывание триггеров значимости зафиксировано"
    weight: 1
    anchors:
      1: "Порог не задан; Solutioning запускается «по ощущению»"
      3: "Триггеры посчитаны, но порог маршрута Fast/Standard/Critical не был задан до оценки"
      5: "Score по 15 триггерам посчитан и записан, порог задан заранее человеком, маршрут следует из порога, а не из желаемого ответа"
  - id: a3_human_decision
    name: A3 — Human Architecture Decision
    description: "Единственная обязательная человеческая точка; результат machine-readable: choice, rationale, constraints, rejected options, expiry"
    weight: 3
    anchors:
      1: "Решение принято без человека на Critical Path, либо человек штампует каждый шаг (approval theater)"
      3: "Человеческое решение есть, но зафиксировано прозой: отвергнутые варианты и срок актуальности потеряны"
      5: "Решение человека записано структурировано: choice, rationale, constraints, rejected options, expiry; одна точка — не резиновый штамп на каждый шаг"
  - id: a4_conformance_evidence
    name: A4 — Conformance Evidence
    description: "Доказательства соответствия решению и fitness functions собраны до выпуска (выборочно/полностью), а не после инцидента"
    weight: 2
    anchors:
      1: "Соответствие решению не проверяется; evidence отсутствует"
      3: "Проверки есть, но не привязаны к конкретным ADR/AD/CONSTRAINTS; выпуск не обусловлен evidence"
      5: "Каждое связывающее решение подкреплено проверкой (fitness function, контрактный тест); выпуск невозможен без собранного evidence bundle"
  - id: a5_drift_check
    name: A5 — Post-deploy Drift Check
    description: "Контроль дрейфа архитектуры после выпуска: по инциденту/тренду, телеметрия и граф архитектуры против спеки"
    weight: 1
    anchors:
      1: "После выпуска за соответствием никто не следит; дрейф обнаруживается инцидентом"
      3: "Дрейф-чеки запускаются, но нерегулярно и без фиксации результата"
      5: "Дрейф-чек — непрерывный процесс с триггерами (инцидент, тренд, расписание); расхождение спека↔код фиксируется и чинится как дефект"
