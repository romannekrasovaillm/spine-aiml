# Рубрика качества оценки модели (домен: classification, бенчмарки;
# 05_МОДЕЛИ_И_АРХИТЕКТУРЫ, 07_Учебные_пособия). Оценивает САМУ ОЦЕНКУ:
# выбор бенчмарка, контаминация, метрика, статзначимость, обобщение,
# человеческая оценка, соответствие задаче, анализ ошибок, честность. Сумма: 100.
name: model_eval_quality
description: "Качество оценки модели: релевантный бенчмарк, проверка контаминации, метрика под задачу, статзначимость, обобщение за пределы одного бенча, человеческая оценка, анализ ошибок и честность отчёта"
scale_max: 5
origin: anchor
criteria:
  - id: benchmark_choice
    name: Выбор бенчмарка
    description: "Бенчмарк релевантен задаче и домену; не «удобный» бенч, а тот, что мерит целевое качество"
    weight: 13
    anchors:
      1: "Бенчмарк выбран по удобству, а не по релевантности; целевое качество им не меряется"
      3: "Бенчмарк релевантен, но единственный и узкий; альтернативы не рассмотрены"
      5: "Бенчмарк(и) релевантны задаче и домену; выбор обоснован, ограничения бенча названы"
  - id: contamination
    name: Проверка контаминации
    description: "Train не пересекается с бенчмарком; проверка контаминации проведена; результаты скорректированы на утечку"
    weight: 13
    anchors:
      1: "Контаминация не проверена; модель могла видеть бенчмарк в train"
      3: "Контаминация проверена грубо; результаты не скорректированы"
      5: "Контаминация проверена (n-граммный/эмбеддинг-поиск), утечка исключена или результаты скорректированы"
  - id: metric_fit
    name: Метрика под задачу
    description: "Метрика соответствует задаче (не единый accuracy); для генерации — не только точное совпадение"
    weight: 12
    anchors:
      1: "Единая метрика на всё; для генерации — точное совпадение, игнорирующее семантику"
      3: "Метрика есть, но не соответствует задаче; альтернативные метрики не рассмотрены"
      5: "Метрика(и) выбраны под задачу (точная/структурная/семантическая); выбор обоснован"
  - id: statistical_rigor
    name: Статистическая строгость
    description: "Дисперсия по сидам, доверительные интервалы, значимость различий; не одна удачная цифра"
    weight: 12
    anchors:
      1: "Один прогон, один сид; различие не проверено на значимость"
      3: "Несколько сидов, но без доверительных интервалов; значимость не оценена"
      5: "Дисперсия по сидам, доверительные интервалы, различие проверено на значимость (bootstrap/тест)"
  - id: generalization
    name: Обобщение
    description: "Качество подтверждено за пределами одного бенча/сплита; OOD-поведение оценено; нет подгонки под eval"
    weight: 11
    anchors:
      1: "Один бенч, один сплит; обобщение не проверено, возможна подгонка"
      3: "Несколько бенчей, но OOD не оценён; подгонка не исключена"
      5: "Множество эвалов + OOD-проверка; результат устойчив за пределами обучающего распределения"
  - id: human_eval
    name: Человеческая оценка
    description: "Там, где авто-метрика слаба (генерация, диалог), привлечена человеческая оценка с межаннотаторским согласием"
    weight: 11
    anchors:
      1: "Только авто-метрика там, где она не отражает качество; человеческой оценки нет"
      3: "Человеческая оценка есть, но без согласия аннотаторов; выборка мала"
      5: "Человеческая оценка с достаточной выборкой и межаннотаторским согласием (κ/α); протокол описан"
  - id: task_alignment
    name: Соответствие задаче
    description: "Оценка отражает реальную задачу пользователя, а не прокси-метрику; сценарий использования учтён"
    weight: 10
    anchors:
      1: "Оценка меряет прокси, а не реальную задачу; сценарий использования проигнорирован"
      3: "Связь с задачей частичная; сценарий использования упомянут, но не в оценке"
      5: "Оценка привязана к реальной задаче и сценарию; прокси-метрики явно обозначены как прокси"
  - id: failure_analysis
    name: Анализ ошибок
    description: "Ошибки разобраны по категориям, а не сведены к одному score; найдены систематические паттерны сбоев"
    weight: 9
    anchors:
      1: "Только итоговый score; ошибки не разобраны, паттерны не искались"
      3: "Ошибки посчитаны, но не категоризированы; систематические сбои не выделены"
      5: "Ошибки категоризированы, систематические паттерны найдены и названы; выводы для следующей итерации"
  - id: report_honesty
    name: Честность отчёта
    description: "Cherry-pick запрещён: все прогоны/бенчи показаны; слабые места названы; сравнение честное (те же условия)"
    weight: 9
    anchors:
      1: "Показаны только лучшие результаты; слабые бенчи скрыты; сравнение в неравных условиях"
      3: "Результаты в основном показаны, но часть опущена; сравнение не полностью честное"
      5: "Все прогоны и бенчи показаны; слабые места названы; сравнение в одинаковых условиях"
