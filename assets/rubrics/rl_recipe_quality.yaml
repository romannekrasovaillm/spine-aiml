# Рубрика качества RL-рецепта (домен: 03_ПОСТ-ТРЕЙНИНГ_RL, credit-assignment,
# agentic-rl; уроки из памяти — GRPO/KL/soft-score/mode-collapse).
# Оценивает РЕЦЕПТ RL до запуска: reward, advantage, регуляризация, дисперсия,
# кредит-присвоение, совместимость стека, путь масштабирования. Сумма: 100.
name: rl_recipe_quality
description: "Качество RL-рецепта: дизайн награды, оценка advantage, KL-регуляризация против mode collapse, дисперсия rollout, кредит-присвоение, совместимость стека и путь масштабирования"
scale_max: 5
origin: anchor
criteria:
  - id: reward_design
    name: Дизайн награды
    description: "Награда плотная и верифицируемая, а не разреженная; частичный кредит за структуру; награда детерминирована по траектории"
    weight: 14
    anchors:
      1: "Награда разреженная (точные совпадения) — advantage≈0, градиент шумит; модель почти не получает сигнала"
      3: "Награда плотнее, но частичный кредит отсутствует; награда не верифицируется отдельно от модели"
      5: "Награда плотная и верифицируемая (структурный + точный кредит); проверена вручную до обучения; детерминирована по траектории"
  - id: advantage_estimator
    name: Оценка advantage
    description: "Group-relative vs global baseline выбраны под размер группы; ненулевая дисперсия наград; std не вырождается"
    weight: 12
    anchors:
      1: "Advantage≈0: группа из малого n с детерминированной наградой гасит градиент; std≈0 не замечен"
      3: "Baseline есть, но дисперсия не мониторится; при малом n group-relative вырождается"
      5: "Оценщик подобран под n (малый n → global baseline/REINFORCE); std наград мониторится и ненулевой"
  - id: kl_regularization
    name: KL-регуляризация
    description: "KL против mode collapse; коэффициент подобран; энтропия не коллапсирует в ноль"
    weight: 12
    anchors:
      1: "KL нет или равен нулю; энтропия падает в ноль (mode collapse) на поздних шагах"
      3: "KL есть, но коэффициент не обоснован; коллапс не мониторится"
      5: "KL-коэффициент обоснован и предотвращает коллапс; энтропия мониторится на каждом шаге (здоровая 1–2)"
  - id: collapse_watch
    name: Мониторинг коллапса
    description: "Энтропия и дисперсия наград отслеживаются на каждом шаге; порог коллапса задан заранее"
    weight: 10
    anchors:
      1: "Коллапс не мониторится; узнаётся постфактум по деградации"
      3: "Энтропия логируется, но порог срабатывания не задан; реакция ручная"
      5: "Энтропия/дисперсия на каждом шаге, порог (<0.1) задан заранее, есть реакция (останов/повышение KL)"
  - id: rollout_diversity
    name: Дисперсия rollout
    description: "Число сэмплов на группу и temperature дают ненулевую дисперсию наград; ответы не детерминированы"
    weight: 10
    anchors:
      1: "n=1–2 и temperature=1 → ответы почти идентичны, дисперсия наград нулевая"
      3: "n/temperature повышены, но дисперсия не проверена; группа всё ещё вырождается"
      5: "n и temperature подобраны под дисперсию наград (std>0), разброс ответов реальный"
  - id: credit_assignment
    name: Кредит-присвоение
    description: "Multi-turn: награда приписана нужному шагу/агенту, а не размазана по всей траектории; verdict-сигналы разделены"
    weight: 10
    anchors:
      1: "Награда за финал размазана по всем шагам; вклад каждого шага неизвестен"
      3: "Кредит приписан частично; verdict-сигналы не отделены от плотной награды"
      5: "Кредит приписан шагу/агенту, который его заслужил; verdict и плотная награда разделены и взвешены явно"
  - id: infra_compat
    name: Совместимость стека
    description: "Версии veRL/vLLM/torch/CUDA сверены до запуска; ABI и kernel-совместимость проверены; не на ходу"
    weight: 8
    anchors:
      1: "Версии не сверены; несовместимость (CUDA 12 vs 13, ABI) ловится в прогоне"
      3: "Версии частично сверены, но сочетание не проверено на практике; патчи не пиннуты"
      5: "Матрица совместимости сверена до аренды; образ и патчи пиннуты; известно, что работает"
  - id: checkpointing
    name: Чекпоинты и откат
    description: "Чекпоинты на шагах, откат воспроизводим, логи сохраняются до teardown"
    weight: 8
    anchors:
      1: "Чекпоинтов нет; падение теряет весь прогон; логи удаляются с инстансом"
      3: "Чекпоинты есть, но нерегулярны; логи сохраняются частично"
      5: "Чекпоинты на каждом шаге, откат к любой точке, логи и веса скопированы до teardown"
  - id: scale_path
    name: Путь масштабирования
    description: "Пилот на малой модели (0.5B) валидирует петлю до дорогого прогона; что переносится на 3B+ — явно"
    weight: 8
    anchors:
      1: "Сразу на дорогой модели; петля не проверена на дешёвом пилоте; бюджет сожжён на отладку"
      3: "Пилот был, но выводы не формализованы; что переносится на большую модель — неясно"
      5: "Пилот на 0.5B валидировал петлю (градиент течёт); перенос на 3B+ спланирован с явными ожиданиями"
  - id: verifiable_gate
    name: Верифицируемый гейт
    description: "Успех проверяется верифицируемым гейтом (fitness/рубрика), а не только loss; гейт независим от обучения"
    weight: 8
    anchors:
      1: "Успех = loss упал; никакого внешнего гейта; loss — не качество"
      3: "Гейт есть, но коррелирует с обучающим сигналом; независимость не гарантирована"
      5: "Верифицируемый гейт (fitness/рубрика) независим от reward; проходит на отложенных задачах"
