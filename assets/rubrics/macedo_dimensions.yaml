# Рубрика по таксономии Macedo (arXiv:2606.04967): 6 измерений зрелости процесса/артефакта.
# Исходная шкала Macedo 0–2 (0 — отсутствует, 1 — частично, 2 — сильно/центрально)
# отображена на шкалу харнесса 1–5: 0→1, 1→3, 2→5 (2 и 4 — промежуточные градации).
# Веса отражают дискриминирующую силу измерений: роли и валидация различают сильнее всего.
name: macedo_dimensions
description: "Оценка по шести измерениям таксономии Macedo — спецификация, контекст, роли, исполнение, валидация, портируемость (шкала 0–2 отображена на 1–5)"
scale_max: 5
origin: anchor
criteria:
  - id: specification
    name: Спецификация
    description: "Как намерение становится рабочим контрактом: спеки, планы, истории, критерии приёмки (у большинства процессов это общий знаменатель)"
    weight: 2
    anchors:
      1: "«0 — отсутствует»: намерение передаётся устно/промптом; рабочего контракта нет"
      3: "«1 — частично»: спеки пишутся, но не являются контрактом — дрейфуют, нет критериев приёмки"
      5: "«2 — центрально»: намерение оформляется исполнимым контрактом со спекой, критериями приёмки и трассируемостью до реализации"
  - id: context
    name: Контекст
    description: "Откуда исполнитель знает, что релевантно: репозиторий, правила, память, свидетельства; контекст как производственный актив"
    weight: 2
    anchors:
      1: "«0 — отсутствует»: контекст — что поместилось в окно; источники не версионируются"
      3: "«1 — частично»: есть правила/память, но без владельцев, freshness и бюджета контекста"
      5: "«2 — центрально»: контекст — версионированный актив с provenance и freshness SLA; доменно-ограниченная поставка под задачу; бюджет окна измеряется"
  - id: roles
    name: Роли
    description: "Кто решает, кто реализует, кто ревьюит: персоны, агенты, ответственность, полномочия (наиболее дискриминирующее измерение)"
    weight: 3
    anchors:
      1: "«0 — отсутствует»: один агент делает всё; ответственность и полномочия не различимы"
      3: "«1 — частично»: роли названы, но без полномочий и accountability; ревьюер = автор"
      5: "«2 — центрально»: разделены design authority и corporate accountability; ревью независим (свежий контекст); допуск ролей калиброван риском"
  - id: execution
    name: Исполнение
    description: "Действует ли процесс в среде или только направляет: правка кода, команды, тесты, терминал"
    weight: 1
    anchors:
      1: "«0 — отсутствует»: процесс производит только документы; до среды не доходит"
      3: "«1 — частично»: исполнение есть, но без изоляции (worktree), таймаутов и журнала действий"
      5: "«2 — центрально»: исполнение в изолированной среде с инструментами, журналом действий и воспроизводимым результатом"
  - id: validation
    name: Валидация
    description: "Как ошибки ловятся до поставки: тесты, гейты, чек-листы, ревью человека (второе по дискриминирующей силе измерение)"
    weight: 3
    anchors:
      1: "«0 — отсутствует»: валидация — «посмотрели глазами»; гейтов нет"
      3: "«1 — частично»: тесты/ревью есть, но не обусловливают выпуск; нет независимой проверки"
      5: "«2 — центрально»: многослойная валидация (детерминированные сенсоры + независимое ревью + evidence-гейт) блокирует поставку при провале"
  - id: portability
    name: Портируемость
    description: "Переживёт ли процесс смену инструмента: множественные интеграции, открытые форматы, отсутствие lock-in"
    weight: 1
    anchors:
      1: "«0 — отсутствует»: процесс неотделим от одного агента/IDE; артефакты в закрытом формате"
      3: "«1 — частично»: артефакты открыты (markdown/YAML), но процедуры прибиты к инструменту"
      5: "«2 — центрально»: процесс переносится между харнессами без потери: открытые форматы, интеграции с несколькими агентами, проверенная миграция"
