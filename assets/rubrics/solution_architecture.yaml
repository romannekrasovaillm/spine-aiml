# Рубрика оценки документа solution-архитектуры (ML-контур).
# 15 взвешенных критериев — переосмысление матрицы §C.3 (docs/SOURCE_BRIEF.md)
# применительно к оценке ДОКУМЕНТА, а не фреймворка. Сумма весов: 100.
name: solution_architecture
description: "Комплексная оценка документа solution-архитектуры ML-системы: от охвата контура данных/моделей до проверяемости и стоимости"
scale_max: 5
origin: anchor
criteria:
  - id: enterprise_scope
    name: Корпоративный охват
    description: "Учтён ли реальный ландшафт ML-контура: существующие пайплайны/модели/данные и их владельцы, утверждённые стандарты и паттерны, приватный периметр и версионирование весов/данных, дорожная карта соседних экспериментов"
    weight: 10
    anchors:
      1: "Решение спроектировано в вакууме: ландшафт, стандарты и регуляторика не упомянуты"
      3: "Ландшафт упомянут, но связи с существующими системами и стандартами декларативны, без конкретики и владельцев"
      5: "Каждый стык привязан к существующей системе и владельцу; названы применимые стандарты/паттерны и регуляторные ограничения с местами их влияния на решение"
  - id: architecture_solutioning
    name: Качество архитектурного решения
    description: "Декомпозиция на компоненты, границы ответственности, стыки и контракты, применённые паттерны; решение — главный артефакт, а не иллюстрация к тексту"
    weight: 10
    anchors:
      1: "Компоненты не выделены или границы размыты; стыки не описаны; паттерны не названы"
      3: "Декомпозиция есть, стыки названы, но контракты и семантика ошибок не определены"
      5: "Компоненты с чёткой ответственностью; на каждом стыке — контракт (формат, ошибки, версия); паттерны названы с обоснованием применимости"
  - id: workflow_executability
    name: Исполнимость
    description: "Можно ли реализовать документ, не изобретая отсутствующих решений: истории/единицы работ покрывают решение, нет «продумать в коде»"
    weight: 9
    anchors:
      1: "Реализация потребует изобретения ключевых решений; документ — намерение, не контракт"
      3: "Основные решения приняты, но встречаются «выбрать/продумать» внутри задач; декомпозиция на работы неполна"
      5: "Разработчик реализует без архитектурных изобретений: все решения приняты и записаны, работы декомпозированы, зависимости между ними явны"
  - id: validation
    name: Валидация и проверяемость
    description: "Критерии приёмки, fitness functions, способы проверки NFR; как ошибки ловятся до поставки"
    weight: 9
    anchors:
      1: "Критерии приёмки отсутствуют или непроверяемы («должно работать быстро»)"
      3: "Критерии есть и измеримы, но не покрывают негативные сценарии и откат; проверка ручная"
      5: "Каждое требование проверяемо: критерии с негативными сценариями, NFR превращены в fitness functions/тесты, способ проверки указан в самом требовании"
  - id: governance_audit
    name: Управляемость и аудит
    description: "След решений (ADR до реализации, статусы), evidence bundle как условие выпуска, воспроизводимость из журнала"
    weight: 9
    anchors:
      1: "Решения не записаны или записаны после реализации; аудиторский след отсутствует"
      3: "ADR ведутся, но неполны (нет альтернатив/отрицательных последствий); evidence собирается по памяти"
      5: "Каждое значимое решение — ADR до реализации с альтернативами и обратимостью; выпуск обусловлен evidence bundle; инцидент воспроизводим из журнала"
  - id: sdd_contract
    name: Спецификация как контракт
    description: "Полнота, однозначность и машиночитаемость спецификации; двусторонняя трассируемость требование ↔ история; дельта-форма для изменений"
    weight: 8
    anchors:
      1: "Спецификация — проза намерений; трассируемости нет; двусмысленности в каждом абзаце"
      3: "Требования пронумерованы и в основном однозначны; трассируемость частичная, сироты не помечены"
      5: "Спека — рабочий контракт: однозначные проверяемые требования, полная двусторонняя трассировка без сирот, изменения — дельтами ADDED/MODIFIED/REMOVED"
  - id: human_decision_control
    name: Контроль человеческих решений
    description: "Человек включён в decisions, а не в events: явная точка A3 с machine-readable результатом; границы автономии заданы заранее"
    weight: 7
    anchors:
      1: "Ни одной явной человеческой контрольной точки; либо человек штампует каждый шаг (approval theater)"
      3: "Человеческие точки названы, но их результат не структурирован; пороги эскалации размыты"
      5: "Единственная обязательная точка A3 оформлена machine-readable (choice, rationale, constraints, rejected options, expiry); границы автономии и пороги эскалации заданы до старта"
  - id: risk_adaptive_autonomy
    name: Риск-адаптивность
    description: "Маршрутизация Fast/Standard/Critical по значимости (обратимость, blast radius, приватные данные/веса, воспроизводимость, security boundary); процесс не одинаков для всех задач"
    weight: 7
    anchors:
      1: "Один процесс на всё: критичное и тривиальное проходят одинаковый (тяжёлый или лёгкий) путь"
      3: "Уровни риска упомянуты, но пороги маршрутизации не определены; оценка обратимости отсутствует"
      5: "Значимость посчитана по триггерам, маршрут обоснован; обратимость и blast radius оценены для каждого значимого решения"
  - id: discovery_framing
    name: Формулировка проблемы
    description: "Проблема и гипотеза результата сформулированы до решения; отделение петли намерения от петли реализации"
    weight: 6
    anchors:
      1: "Документ начинается с решения; проблема не сформулирована или подогнана под ответ"
      3: "Проблема названа, но гипотеза результата не измерима; альтернатива «ничего не делать» не оценена"
      5: "Проблема, гипотеза результата с метрикой успеха и цена бездействия зафиксированы до обсуждения решения"
  - id: nfr_tradeoffs
    name: NFR и компромиссы
    description: "Измеримые NFR (latency, доступность, RTO/RPO, стоимость), явные trade-offs, слоистость functional → nfr → infra"
    weight: 6
    anchors:
      1: "NFR отсутствуют или сформулированы пожеланиями без чисел"
      3: "NFR с числами есть, но trade-offs не названы; слои functional/nfr/infra перемешаны"
      5: "NFR-бюджеты измеримы и проверяемы; каждый достигнут тактикой с явной ценой; конфликты NFR разрешены записанными решениями"
  - id: brownfield
    name: Учёт legacy
    description: "Brownfield-реальность: карта текущего состояния с метками уверенности, стратегия сосуществования и миграции, обратимость"
    weight: 6
    anchors:
      1: "Документ предполагает greenfield там, где годы накопленных пайплайнов и скриптов; текущее состояние не обследовано"
      3: "Legacy упомянут, но без меток уверенности/пробелов; миграция описана одной фразой"
      5: "Текущее состояние покрыто картой с confidence/gaps; миграция пошагова с сосуществованием и точками отката"
  - id: portability
    name: Портируемость
    description: "Отсутствие неоправданного lock-in: открытые форматы артефактов, заменяемость инструментов и вендоров, цена выхода"
    weight: 4
    anchors:
      1: "Решение жёстко прибито к вендору/инструменту без обоснования; цена выхода не оценена"
      3: "Lock-in осознан и обоснован для части стыков; форматы артефактов открыты"
      5: "Каждый вендор-зависимый стык обоснован и имеет оценку цены выхода; артефакты портируемы между инструментами"
  - id: org_transformation
    name: Организационная состоятельность
    description: "Роли и ответственность (кто accountable), операционная модель эксплуатации решения, влияние на команды"
    weight: 4
    anchors:
      1: "Не назван ни один владелец/роль; эксплуатация решения никому не принадлежит"
      3: "Владельцы названы, но операционная модель и нагрузка на команды не оценены"
      5: "Accountable-роли назначены поимённо (или по позициям); операционная модель, on-call и влияние на команды описаны"
  - id: cross_team_governance
    name: Межкомандное согласование
    description: "Cross-domain стыки: согласование контрактов между командами, наследование инвариантов, эскалация конфликтов"
    weight: 3
    anchors:
      1: "Стыки с другими доменами не замечены; конфликтам некуда эскалироваться"
      3: "Соседние команды перечислены, но механика согласования контрактов не определена"
      5: "Для каждого cross-domain стыка есть владелец с той стороны и механика согласования; наследование spine-инвариантов и путь эскалации описаны"
  - id: low_entry_cost
    name: Порог внедрения
    description: "Прагматика: стоимость старта и сопровождения решения, переиспользование готовых паттернов, отсутствие бюрократии ради бюрократии"
    weight: 2
    anchors:
      1: "Решение требует новой платформы/процесса там, где хватило бы существующего паттерна"
      3: "Паттерны частично переиспользованы; стоимость сопровождения оценена грубо"
      5: "Максимум переиспользования утверждённых паттернов; стоимость старта и владения оценена; новые сущности обоснованы"
