# Рубрика качества ADR (дисциплина AWS AI-DLC, docs/SOURCE_BRIEF.md §A.2):
# запись до реализации, альтернативы, отрицательные последствия, обратимость, статусы.
name: adr_quality
description: "Качество архитектурного решения (ADR): контекст, альтернативы, отрицательные последствия, обратимость, статус-дисциплина"
scale_max: 5
origin: anchor
criteria:
  - id: context
    name: Контекст и силы
    description: "Проблема, действующие силы и ограничения (регуляторика, ландшафт, бюджет, сроки); из контекста понятно, почему решение вообще потребовалось"
    weight: 2
    anchors:
      1: "Контекст отсутствует или сведён к «надо сделать»; силы не названы"
      3: "Проблема описана, но ограничения и силы частичны; непонятна цена бездействия"
      5: "Проблема, силы и ограничения полны; через год из контекста ясно, почему решение было необходимо и актуальны ли ещё его предпосылки"
  - id: alternatives
    name: Альтернативы
    description: "Минимум две осмысленные альтернативы + статус-кво; для каждой — причина отказа"
    weight: 3
    anchors:
      1: "Альтернатив нет; выбран единственный рассмотренный вариант"
      3: "Альтернативы перечислены, но картонны (заведомо слабые) или без причин отказа; статус-кво не оценён"
      5: "Реальные альтернативы с честными причинами отказа, включая «ничего не делать» с его ценой; понятно, при каких условиях выбор изменился бы"
  - id: negative_consequences
    name: Отрицательные последствия
    description: "Честные издержки решения: что станет хуже, для кого, насколько; митигация"
    weight: 2
    anchors:
      1: "Записаны только плюсы — решение без издержек не существует, значит они не найдены"
      3: "Минусы названы, но абстрактны («усложнение поддержки») и без митигации"
      5: "Издержки конкретны и адресны (кого и как заденет), с митигацией или сознательным принятием; они проверяемы при пересмотре"
  - id: reversibility
    name: Обратимость
    description: "Оценка обратимости: trivially reversible / reversible with cost / irreversible; для irreversible — план отката или сосуществования и человеческое решение"
    weight: 2
    anchors:
      1: "Обратимость не оценена; «откатим, если что» без описания как"
      3: "Категория обратимости названа, но путь отката не описан; irreversible не эскалировано"
      5: "Обратимость честно категорирована; для irreversible — план отката/сосуществования и след человеческого решения (A3); для reversible — описан и проверен путь назад"
  - id: status_discipline
    name: Статус-дисциплина
    description: "Запись до реализации; жизненный цикл Proposed → Accepted → Deprecated/Superseded; номера не переиспользуются; expiry/пересмотр"
    weight: 1
    anchors:
      1: "ADR написан после реализации или статус не соответствует реальности"
      3: "Статусы ведутся, но нет связей Superseded/expiry; пересмотр не планируется"
      5: "ADR предшествует реализации; связи Superseded корректны; временные решения имеют expiry или условие пересмотра; номера стабильны"
