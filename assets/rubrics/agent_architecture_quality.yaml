# Рубрика качества агентной архитектуры (домен: agent-harness, agents,
# agent-tooling, context-engineering, a2a; + ось «детерминированный контроль»
# флота из дорожной карты Spine AI/ML). Оценивает ДИЗАЙН агентной системы:
# роутинг, инструменты, контекст, управление, наблюдаемость. Сумма: 100.
name: agent_architecture_quality
description: "Качество агентной архитектуры: детерминированный роутинг, контракт инструментов, контекст-инжиниринг, канал управления, стрим-проекция, топология мультиагентности, заменяемые слои, аудиторский след"
scale_max: 5
origin: anchor
criteria:
  - id: routing_determinism
    name: Детерминированный роутинг
    description: "Назначение работы агентам — детерминированный скоринг (capability × load × risk × cost), а не LLM-угадайка; карта назначений аудируема"
    weight: 14
    anchors:
      1: "Роутинг делает сама модель по наитию; назначения не воспроизводимы и не объяснимы"
      3: "Роутинг частично формализован, но скор и причины не сохраняются; решение не аудируемо"
      5: "Детерминированный роутер со скором и причинами на каждое назначение; LLM декомпозирует, роутер назначает"
  - id: tool_contract
    name: Контракт инструментов
    description: "Инструменты со схемой, таймаутами, идемпотентностью; антирекурсия (субагенту не выдаются subagent-инструменты); whitelist по специализации"
    weight: 12
    anchors:
      1: "Инструменты без схемы/таймаутов; агент может вызвать сам себя рекурсивно; whitelist нет"
      3: "Схемы есть, но таймауты не заданы; антирекурсия частичная"
      5: "Каждый инструмент: схема + таймаут + идемпотентность; антирекурсия и whitelist по специализации enforced"
  - id: context_engineering
    name: Контекст-инжиниринг
    description: "Что попадает в контекст — осознанно: бюджет окна, компрессия, несжимаемый слой инвариантов; флот не топит контекст сырым stdout"
    weight: 12
    anchors:
      1: "Контекст раздут сырьём; бюджет не контролируется; большое окно тратится впустую"
      3: "Бюджет задан, но несжимаемый слой не выделен; компрессия теряет инварианты"
      5: "Бюджет окна на фазу, несжимаемый слой инвариантов переносится дословно, проекция вместо сырого вывода"
  - id: control_channel
    name: Канал управления
    description: "Наблюдение + управление живым прогоном: pause/resume/kill/reroute через общий артефакт; вмешательство возможно на лету"
    weight: 10
    anchors:
      1: "Управления нет: агент запущен и неуправляем до конца; kill только всей системы"
      3: "Управление частичное (только kill); pause/reroute не реализованы"
      5: "Полный control-канал (pause/resume/kill/reroute/priority) через общий артефакт; применяется на heartbeat"
  - id: streaming_projection
    name: Стрим как проекция
    description: "Живой стрим — проекция единого журнала (статус/тайминги/heartbeat), а не сырой stdout; флот в N агентов наблюдаем как 1"
    weight: 10
    anchors:
      1: "Стрима нет: результат только по завершении; либо сырой stdout топит контроллера"
      3: "Стрим есть, но не проекция: сырой вывод всех агентов дублируется в контекст"
      5: "Событие = строка журнала, стрим = проекция; полный вывод — на диск; флот наблюдаем дёшево"
  - id: multi_agent_topology
    name: Топология мультиагентности
    description: "Выбор оркестратор vs рой равных осознан; зависимость и стоимость обоснованы; нет «умного центра» без нужды"
    weight: 10
    anchors:
      1: "Топология не обоснована: рой равных там, где нужен оркестратор (или наоборот); цена не оценена"
      3: "Выбор сделан, но trade-offs (стоимость, предсказуемость, аудит) не названы"
      5: "Оркестратор vs рой выбран по критериям (стоимость, предсказуемость, аудит); trade-offs записаны"
  - id: harness_seams
    name: Заменяемые слои
    description: "Слои за трейтами/реестрами (llm/tool/kb/web/mcp); замена провайдера/инструмента без переписывания ядра"
    weight: 8
    anchors:
      1: "Слои связаны напрямую; замена LLM/инструмента требует правок ядра"
      3: "Часть слоёв за трейтами; часть связана; замена непоследовательна"
      5: "Все capability-слои за трейтами/реестрами; замена точечная, ядро не трогается"
  - id: audit_trail
    name: Аудиторский след
    description: "Инвариант «model-visible ⟺ logged»: всё, что видит модель, восстановимо из append-only журнала; реплей дословен"
    weight: 8
    anchors:
      1: "Журнала нет или он неполон; что видел агент — не восстановимо"
      3: "Журнал есть, но инвариант не enforced; часть model-visible входа теряется"
      5: "Журнал append-only — источник истины; fork/resume/транскрипт — проекции одного потока; реплей дословен"
  - id: failure_memory
    name: Память ошибок
    description: "Повторные сбои превращаются в урок (ошибся дважды → урок); урок загружается в будущие сессии"
    weight: 8
    anchors:
      1: "Сбои не фиксируются; та же ошибка повторяется в каждой сессии"
      3: "Сбои логируются, но не превращаются в урок; память не влияет на поведение"
      5: "Повторный сбой порождает урок, который загружается и меняет поведение будущих сессий"
  - id: autonomy_policy
    name: Политика автономии
    description: "R-уровни автономии заданы заранее; деструктив требует подтверждения; человеко-гейты на значимых решениях"
    weight: 8
    anchors:
      1: "Автономия без границ: агент делает деструктив без подтверждения; человек не в контуре решений"
      3: "Политика есть, но пороги размыты; деструктив не всегда гейтится"
      5: "R-уровни и пороги эскалации заданы до старта; деструктив гейтится человеком; значимые решения — machine-readable"
