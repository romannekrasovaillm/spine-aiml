# Spine-BE SDK v1 для Rust — тонкий клиент поверх headless CLI `arch-ml`.
# Крейт standalone: корневой Cargo.toml репо не workspace, этот пакет
# собирается независимо из sdk/rust (пустая секция [workspace] ниже
# фиксирует изоляцию от родительского пакета).
[package]
name = "spine-be-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Тонкий Rust-клиент (SDK) поверх headless CLI arch-ml (Spine-BE), контракт v1"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
