[package]
name = "arch-harness"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "Доменный харнесс solution-архитектора: TUI, mermaid, рубрики, бенчмарки, MCP, интеграция кодовых харнессов"
license = "MIT"
default-run = "arch-ml"

[[bin]]
name = "arch-ml"
path = "src/main.rs"

[lib]
name = "arch_harness"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cron-parser = "0.8"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1"
walkdir = "2"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
# tempfile в основных зависимостях: герметичный дом встроенного eval-сьюта
# (src/eval.rs, `arch eval run`) разворачивается во временный каталог.
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"

[[bench]]
name = "harness_benches"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Явная политика допускаемых pedantic-линтов (волна P2-4, 2026-08-17):
# каждая строка — решение с обоснованием, а не молчаливая толерантность.
# Все остальные pedantic-линты зачищены до нуля; состояние удерживается
# CI-джобой clippy с `-D warnings` (см. ADR-005, Update 2026-08-17).
# Арифметика геометрии терминала (u16), счётчиков и баллов рубрик: значения
# ограничены по построению, потеря точности/знака/переполнение несущественны.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Длинные render/парсер-функции TUI: дробление ради линта ухудшает читаемость;
# декомпозиция крупных модулей — отдельная задача P2-3 ревью.
too_many_lines = "allow"
# Сравнения float живут только в тестовых ассертах над точно представимыми
# значениями (баллы рубрик 4.2/3.5, σ = 0.0) — равенство там осмысленно.
float_cmp = "allow"
# `&Option<T>` в приватных помощниках — осознанный стиль вызова.
ref_option = "allow"
# Аксессоры Theme единообразны с соседними &self-методами семейства.
unused_self = "allow"
# Публичную сигнатуру prompts::render не обобщаем по BuildHasher ради линта.
implicit_hasher = "allow"
# Конфиг-структуры с флагами читаемее иерархии enum'ов.
struct_excessive_bools = "allow"
# Волна 2026-09-13 (первый прогон CI после форка AI/ML Edition): классы ниже
# всплыли суммарно 84 срабатываниями на stable 1.98 — код форка до форка CI
# не гонял. Допущены как осознанный долг до отдельной зачистки; hard-гейты
# (MSRV 1.85, fmt, test, dogfood) остаются строгими.
# Механические стили (зачистка одной волной, без смены поведения):
useless_conversion = "allow"          # 25: идентичный .into() при возвратах ManagedError
format_push_string = "allow"          # 13: format! в push_str при накоплении отчётов
items_after_statements = "allow"      # 6: локальные fn/struct после выражений
similar_names = "allow"               # 6: соседние binding'и — переименование отдельным решением
single_match_else = "allow"           # 3: match с двумя рукавами читаемее if let
doc_markdown = "allow"                # 12: обратные кавычки в doc-комментариях
missing_errors_doc = "allow"          # 2: секции # Errors в публичных fn
missing_panics_doc = "allow"          # 1: секция # Panics
manual_let_else = "allow"             # 1
manual_checked_ops = "allow"          # 1
format_collect = "allow"              # 1
field_reassign_with_default = "allow" # 1
assigning_clones = "allow"            # 1
unused_async = "allow"                # 1: async-единообразие семейства fn
needless_borrow = "allow"             # 1
redundant_closure_for_method_calls = "allow" # 1
match_same_arms = "allow"             # 1: рукава разделены осознанно (читаемость)
struct_field_names = "allow"          # 1: префикс полей — имена предметной области
missing_fields_in_debug = "allow"     # 1: Debug у concept скрывает поля намеренно
regex_creation_in_loops = "allow"     # 1: control.rs — реальный кандидат на hoist (perf), не линт-вкус

[profile.release]
lto = "thin"
debug = "line-tables-only"
strip = true

# Профили dev/test: без явной настройки cargo собирает их с debug=2 (полный
# DWARF), из-за чего target/ на ворктри раздувается до нескольких гигабайт
# (основной вклад — target/debug/incremental и target/debug/deps; на этой машине
# наблюдались target/ ворктри размером ~5-6 ГБ). line-tables-only сохраняет имена
# файлов и номера строк — этого достаточно для стектрейсов и профайлера, — но
# сокращает объём DWARF. Точный выигрыш зависит от графа зависимостей и версии
# тулчейна. Точной цифры здесь нет намеренно: проверяемого артефакта замера не
# существует (ранее стояло «257 → 201 МБ (−22 %)» — неподтверждённое число
# удалено; контекст — раздел «Числа» в docs/build_cache.md).
#
# split-debuginfo = "unpacked" сознательно НЕ включён: на Linux он не уменьшает
# суммарный объём target/ (DWARF переезжает в отдельные *.dwo — те же байты плюс
# накладные расходы на множество мелких файлов), на macOS это и так значение по
# умолчанию, а на Windows стабильный rustc его не поддерживает (жёсткая ошибка
# сборки). См. rustc codegen-options: значения split-debuginfo ограничены
# платформой, на прочих — только "off".
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
