# CONSTRAINTS.yaml — ГЕЙТ задачи ml-serving-split.
# Один и тот же файл для ВСЕХ рук и повторов. Заморожен пререгистрацией.
# Проверка: arch-ml control check <cell>/work --constraints <этот файл> --json
# severity: critical|high -> error, medium -> warn.
constraints:
  # Д1: спин существует и содержит инварианты AD-<n>
  - id: SVC-SPLIT-01
    name: deliverable-spine
    type: must_contain
    glob: "docs/ARCHITECTURE-SPINE.md"
    pattern: "(?m)^#{2,3}\\s*AD-\\d+"
    severity: critical

  # Д2: минимум один ADR с корректным заголовком
  - id: SVC-SPLIT-02
    name: deliverable-adr
    type: must_contain
    glob: "docs/adr/ADR-*.md"
    pattern: "(?m)^#\\s*ADR-\\d{3}"
    severity: critical

  # Д3: журнал решений с именным аппрувером (белое пятно (а))
  - id: SVC-SPLIT-03
    name: decision-approver
    type: must_contain
    glob: "DECISION.md"
    pattern: "(?i)(approver|аппрувер)\\s*:\\s*\\S+"
    severity: critical

  # Д4: журнал привязан к версии спеки (хэш)
  - id: SVC-SPLIT-04
    name: decision-spec-binding
    type: must_contain
    glob: "DECISION.md"
    pattern: "spec:\\s*sha256:[0-9a-f]{64}"
    severity: critical

  # Д5: журнал — не заглушка, есть записи решений
  - id: SVC-SPLIT-05
    name: decision-journal-entries
    type: must_contain
    glob: "DECISION.md"
    pattern: "(?m)^##\\s*(DEC|РЕШ)"
    severity: high

  # Д6: адресный след приёмки (рецензия §3.5: ADR-id, не дословная цитата)
  - id: SVC-SPLIT-06
    name: trace-addressed
    type: must_contain
    glob: "TRACE.md"
    pattern: "AC-\\d{2}\\s*->\\s*ADR-\\d{3}"
    severity: critical

  # Д7: доказательства приёмки ссылаются на критерии
  - id: SVC-SPLIT-07
    name: acceptance-evidence
    type: must_contain
    glob: "ACCEPTANCE-EVIDENCE.md"
    pattern: "AC-\\d{2}"
    severity: high

  # Д8: ADR содержит отвергнутые альтернативы (решение, а не пересказ)
  - id: SVC-SPLIT-08
    name: adr-alternatives
    type: must_contain
    glob: "docs/adr/ADR-*.md"
    pattern: "(?i)(отвергнут|альтернатив|rejected|alternatives)"
    severity: high

  # Д9: без незаполненных заглушек в артефактах
  - id: SVC-SPLIT-09
    name: no-stub-markers
    type: must_not_contain
    glob:
      - "docs/**/*.md"
      - "DECISION.md"
      - "TRACE.md"
      - "ACCEPTANCE-EVIDENCE.md"
    pattern: "(?i)\\b(TODO|TBD|FIXME)\\b"
    severity: high

  # Д10 (домен): граница train/serve названа явно
  - id: SVC-SPLIT-10
    name: train-serve-boundary
    type: must_contain
    glob: "docs/ARCHITECTURE-SPINE.md"
    pattern: "(?i)(train|обучен)\\w*\\s*[/\\- ]+\\s*(serv|серв)"
    severity: high

  # Д11 (домен): артефакт модели не хранится в git (warn — ловится эвристикой)
  - id: SVC-SPLIT-11
    name: no-model-weights-in-repo
    type: must_not_contain
    glob: "docs/**/*.md"
    pattern: "(?i)(веса|weights|артефакт\\w*\\s+модел\\w*)\\s+(в|хранятся в|лежат в|in)\\s+(git|репозитори)"
    severity: medium
