# mech_overrides.yaml — mechanical_checks для задач без собственного блока в RUBRICS.md.
# PGL-ARCH-001 (внешняя задача из ~/Загрузки/arch-benchmark) блока §9 не содержит;
# паттерны ниже составлены по шаблону §5 её TASK.md (D1–D10) в том же стиле,
# что и у остальных задач бенчмарка. Детекторы HF — кандидаты, финальное
# решение всегда за судьёй (как и в штатных блоках).

## PGL-ARCH-001
```yaml
mechanical_checks:
  max_words: 4000
  deliverables:        # наличие разделов-артефактов в ответе (regex по тексту ответа)
    - {id: D1,  pattern: '(?im)^#{1,4}.*резюме'}
    - {id: D2,  pattern: '(?im)^#{1,4}.*(схема|разв[её]ртывани)'}
    - {id: D3,  pattern: '(?im)^#{1,4}.*(топологи|отказоустойчив|HA|DR)'}
    - {id: D4,  pattern: '(?im)^#{1,4}.*безопасност'}
    - {id: D5,  pattern: '(?im)^#{1,4}.*(резервн\w*\s+копир|восстановлен|бэкап|backup)'}
    - {id: D6,  pattern: '(?im)^#{1,4}.*(производительност|ёмкост|сайзинг)'}
    - {id: D7,  pattern: '(?im)^#{1,4}.*миграц'}
    - {id: D8,  pattern: '(?im)^#{1,4}.*эксплуатац'}
    - {id: D9,  pattern: '(?im)^#{1,4}.*трассиров'}
    - {id: D10, pattern: '(?im)^#{1,4}.*(допущени|риск|открыт|альтернатив)'}
  hard_fails:          # механические детекторы-кандидаты (судья подтверждает семантику)
    - {id: HF-01, pattern: '(?im)(один|1|два|2)\s+(узл\w*|экземпляр\w*)\s+(DCS|etcd)', note: 'эвристика: DCS из 1–2 узлов; судья проверяет обоснование и компенсирующие меры'}
    - {id: HF-03, pattern: '(?i)Pangolin[ -]?(Proxy|Vault|Manager|Balancer)|Pangolin[^.\n]{0,50}встроенн\w+\s+балансировщик', note: 'вымышленные компоненты Pangolin как факт; подтверждает судья'}
    - {id: HF-04, pattern: '(?im)(rpo\s*[=≤]?\s*0|нулев\w+\s+rpo)[^\n]{0,120}(цод|асинхронн|репликац)', note: 'кандидат: нулевой RPO в контексте ЦОД/асинхронной репликации; судья проверяет семантику'}
    - {id: HF-05, pattern: '__derived_from_deliverables__', note: 'отсутствие любого deliverable D1–D10 = кандидат на HF-05'}
```
