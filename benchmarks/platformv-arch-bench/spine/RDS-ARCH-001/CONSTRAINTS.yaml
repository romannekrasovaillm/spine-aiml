# CONSTRAINTS.yaml — fitness-правила для RDS-ARCH-001 (генерируется prepare_cells.py).
# Источник: mechanical_checks из RUBRICS.md (rubrics).
# Проверка: arch-be control check . --constraints CONSTRAINTS.yaml
constraints:
  - id: SP-RDS-ARCH-001-01
    name: deliverable-d1
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*резюме"
    severity: high

  - id: SP-RDS-ARCH-001-02
    name: deliverable-d2
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*схема[ \\n]|```(mermaid|plantuml)"
    severity: high

  - id: SP-RDS-ARCH-001-03
    name: deliverable-d3
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(топологи|шардирован)"
    severity: high

  - id: SP-RDS-ARCH-001-04
    name: deliverable-d4
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(отказоустойчивост|катастрофоустойчивост|HA|DR|репликац)"
    severity: high

  - id: SP-RDS-ARCH-001-05
    name: deliverable-d5
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(персистентност|сохранност|восстановлен|RDB|AOF)"
    severity: high

  - id: SP-RDS-ARCH-001-06
    name: deliverable-d6
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(памят|эвикци|вытеснен|производительност|ёмкост)"
    severity: high

  - id: SP-RDS-ARCH-001-07
    name: deliverable-d7
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(безопасност|ПДн|PII|персональн)"
    severity: high

  - id: SP-RDS-ARCH-001-08
    name: deliverable-d8
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(эксплуатац|мониторинг)"
    severity: high

  - id: SP-RDS-ARCH-001-09
    name: deliverable-d9
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*трассировк"
    severity: high

  - id: SP-RDS-ARCH-001-10
    name: deliverable-d10
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,4}[^\\n]*(допущен|риск|альтернатив)"
    severity: high

  - id: SP-RDS-ARCH-001-99
    name: max-words
    type: command_succeeds
    command: "bash -c \"test $(wc -w < answer.md 2>/dev/null || echo 999999) -le 4000\""
    severity: medium
