# CONSTRAINTS.yaml — fitness-правила для DR-ARCH-001 (генерируется prepare_cells.py).
# Источник: mechanical_checks из RUBRICS.md (rubrics).
# Проверка: arch-be control check . --constraints CONSTRAINTS.yaml
constraints:
  - id: SP-DR-ARCH-001-01
    name: deliverable-d1
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*резюме"
    severity: high

  - id: SP-DR-ARCH-001-02
    name: deliverable-d2
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(тополог|схем)"
    severity: high

  - id: SP-DR-ARCH-001-03
    name: deliverable-d3
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(матриц|RTO|RPO)"
    severity: high

  - id: SP-DR-ARCH-001-04
    name: deliverable-d4
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(согласованност|точк\\w*\\s+восстановлен|консистентност)"
    severity: high

  - id: SP-DR-ARCH-001-05
    name: deliverable-d5
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(сценари|отказ)"
    severity: high

  - id: SP-DR-ARCH-001-06
    name: deliverable-d6
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(переключени|возврат)"
    severity: high

  - id: SP-DR-ARCH-001-07
    name: deliverable-d7
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(учени|регламент)"
    severity: high

  - id: SP-DR-ARCH-001-08
    name: deliverable-d8
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(мониторинг|наблюдаемост)"
    severity: high

  - id: SP-DR-ARCH-001-09
    name: deliverable-d9
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*трассиров"
    severity: high

  - id: SP-DR-ARCH-001-10
    name: deliverable-d10
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(допущени|риск|альтернатив)"
    severity: high

  - id: SP-DR-ARCH-001-99
    name: max-words
    type: command_succeeds
    command: "bash -c \"test $(wc -w < answer.md 2>/dev/null || echo 999999) -le 4000\""
    severity: medium
