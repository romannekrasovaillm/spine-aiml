# CONSTRAINTS.yaml — fitness-правила для SYN-ARCH-001 (генерируется prepare_cells.py).
# Источник: mechanical_checks из RUBRICS.md (rubrics).
# Проверка: arch-be control check . --constraints CONSTRAINTS.yaml
constraints:
  - id: SP-SYN-ARCH-001-01
    name: deliverable-d1
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*резюме"
    severity: high

  - id: SP-SYN-ARCH-001-02
    name: deliverable-d2
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(тополог|схема разв)"
    severity: high

  - id: SP-SYN-ARCH-001-03
    name: deliverable-d3
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(карта|матрица|реестр)[^\\n]*поток"
    severity: high

  - id: SP-SYN-ARCH-001-04
    name: deliverable-d4
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(надёжн|надежн)[^\\n]*(доставк|гарант)|^#{1,3}.*гарантии доставки"
    severity: high

  - id: SP-SYN-ARCH-001-05
    name: deliverable-d5
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(катастрофоуст|DR\\b|межкластерн|межцодов)"
    severity: high

  - id: SP-SYN-ARCH-001-06
    name: deliverable-d6
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(миграц)[^\\n]*(откат|план)|^#{1,3}.*план миграции"
    severity: high

  - id: SP-SYN-ARCH-001-07
    name: deliverable-d7
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*безопасн"
    severity: high

  - id: SP-SYN-ARCH-001-08
    name: deliverable-d8
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(наблюдаем|мониторинг|тестирован)"
    severity: high

  - id: SP-SYN-ARCH-001-09
    name: deliverable-d9
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*трассиров"
    severity: high

  - id: SP-SYN-ARCH-001-10
    name: deliverable-d10
    type: must_contain
    glob: "answer.md"
    pattern: "(?im)^#{1,3}.*(допущен|риск|альтернатив)"
    severity: high

  - id: SP-SYN-ARCH-001-99
    name: max-words
    type: command_succeeds
    command: "bash -c \"test $(wc -w < answer.md 2>/dev/null || echo 999999) -le 4000\""
    severity: medium
