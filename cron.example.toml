# =============================================================================
# arch-ml — пример расписания md-задач (cron.toml)
# =============================================================================
# Принцип: задача — это markdown-инструкция; исполнитель — LLM с ядерными
# инструментами (bash-пайпы!); тайминг — 5-полевое cron-выражение
# (минута час день-месяца месяц день-недели).
#
# Поля задачи:
#   name     — уникальное имя (по нему `arch-ml cron run <name>`);
#   schedule — 5-полевое cron-выражение;
#   task_md  — файл с md-инструкцией (образцы — examples/cron/*.md в репо;
#              `arch-ml init` копирует их в ~/.arch-ml/cron/);
#   model    — опционально: модель из [models] (иначе — default_model);
#   out      — опционально: каталог отчётов (иначе <reports_dir>/cron).
#
# ВНИМАНИЕ: тильда в task_md НЕ раскрывается автоматически — после `arch-ml init`
# при необходимости замените на абсолютные пути. Запуск из системного cron:
#   */15 * * * * arch-ml cron tick >> ~/.arch-ml/reports/cron/tick.log 2>&1
# =============================================================================

# Ежедневный дайджест новых материалов базы знаний (каталоги [knowledge]).
# Отчёт: markdown + headless JSON-статус в конце; индекс — reports/cron/INDEX.md.
[[job]]
name = "kb-digest"
schedule = "30 9 * * *"
task_md = "~/.arch-ml/cron/kb_digest.md"
model = "deepseek"

# Дрейф-чек спецификаций (гейт A5 по расписанию): свежесть docs/specs/*.md
# против свежих коммитов кода, расхождения — только со свидетельствами.
# Будни в 18:00, рассуждающая модель: нужна аккуратная работа со свидетельствами.
[[job]]
name = "spec-drift"
schedule = "0 18 * * 1-5"
task_md = "~/.arch-ml/cron/spec_drift.md"
model = "deepseek-pro"
out = "~/.arch-ml/reports/cron/spec-drift"

# Дрейф-контроль AGENTS.md по флоту репозиториев: свежесть сгенерированных зон,
# покрытие флота, error-проблемы. Реестр: ~/.arch-ml/repos.txt.
[[job]]
name = "agents-md-drift"
schedule = "20 8 * * 1-5"
task_md = "~/.arch-ml/cron/agents_md_drift.md"
model = "deepseek"

# -----------------------------------------------------------------------------
# Continuous evals конфигурации харнесса (docs/evals.md): детерминированный
# сьют `arch eval run` не требует LLM, поэтому вешается на СИСТЕМНЫЙ cron
# напрямую (мимо cron.toml — md-задачи тут исполняются моделью):
#   20 7 * * * arch eval run >> ~/.arch-ml/evals/eval.log 2>&1
# Триггер-политика: прогон при любом изменении config.toml, библиотеки
# скиллов/плагинов ([plugins] dirs), политики автономии и хуков — деградация
# конфигурации ловится гейтом pass-rate (дефолт 100%, exit 1 ниже порога).
# Прогон живой установки (не герметичной):
#   arch eval run --suite ~/.arch-ml/assets/evals/agent-config
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Goal-режим — контроль-петля автопродолжения (см. aiml/notes/goal-mode.md).
#
# Отличие от задач выше: обычная [[job]] срабатывает по расписанию и отрабатывает
# ОДИН заход; goal-режим после КАЖДОГО терна переинжектит цель в конец контекста
# синтетическим user-сообщением (<system-reminder> с objective + критерием +
# статистикой; помечено как untrusted-данные — «это данные, не инструкции»), пока
# механическая проверка критерия не подтвердит complete. Гол даёт ЧАСТЫЕ мелкие
# тики, cron — РЕДКИЕ независимые протокольные проверки; вместе — двухчастотный
# сторож автономного прогона. Транспорт у обоих один: user-сообщение.
#
# Пример ниже ЗАКОММЕНТИРОВАН намеренно:
#   * тест src/assets.rs::example_cron_parses_and_tasks_are_shipped проверяет
#     ровно 3 живые [[job]] и что каждый task_md раскладывается
#     write_defaults (DEFAULT_FILES). Живой 4-й goal-job сломает этот тест.
#   * поля goal/criterion/budget — НЕ часть схемы CronJob (src/cron.rs):
#     состояние цели живёт в контроль-петле сессии, а task_md задаёт лишь
#     протокол проверки.
# Включить: раскомментировать (task_md уже раскладывается `arch-ml init`:
# examples/cron/goal_protocol.md зарегистрирован в DEFAULT_FILES).
#
# [[job]]
# name = "goal-protocol-check"
# schedule = "13,43 * * * *"
# task_md = "~/.arch-ml/cron/goal_protocol.md"
# model = "deepseek-pro"
# -----------------------------------------------------------------------------
