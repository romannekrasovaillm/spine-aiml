  # ── ADR-046 п.8: номер правила — ресурс канона ────────────────────────────
  # Зачем правило, а не дисциплина. Номер правила выдаётся локальным счётом
  # каталога в каждом worktree: ветвь считает занятые номера по СВОЕМУ файлу и
  # выдаёт следующий свободный у себя. Класс дефекта воспроизводился трижды и
  # каждый раз ловился человеком, а не механизмом (ADR-024 — дубль номера
  # решения; C-020/C-021 — ветвь карточки SFT-набора; C-029 — «Доказательство
  # исполнения» против стража сна, разведено на C-031 коммитом 51ca0a5).
  # Номер выдаёт линия, из которой выдаются дельты (ADR-046 п.8), а ветвь не
  # видит чужих номеров до сведения — поэтому дисциплина без механизма здесь не
  # работает ПО ПОСТРОЕНИЮ, и отказ от механизма означал бы согласие ловить это
  # глазами и дальше.
  #
  # Что проверяется. У каждой НЕЗАЛИТОЙ ветви берётся множество номеров, которое
  # она выдала САМА (её номера минус номера точки ветвления, `git merge-base`), и
  # сверяется с номерами канона. Красное — при пересечении: номер уже отдан
  # другому правилу, и сведение либо потеряет правило, либо сделает номер
  # неоднозначным. Тот же дефект между кандидатами — номер, выданный более чем
  # одной незалитой ветвью, — находка, даже если канон его ещё не занял.
  #
  # Три состояния, а не два (ADR-023 п.12). Ветвь, чья вершина — предок канона,
  # уже сведена и кандидатом не является: без этого страж краснел бы на
  # собственной истории. Ветвь, отставшая от канона, несёт и старые номера — они
  # не её, и красить их значило бы объявлять находкой сам факт ветвления.
  # Ветвь без файла правил кейса (другой кейс) и ветвь с несвязанной историей
  # печатаются поимённо в списке пропусков с причиной — за проверенную не
  # выдаются, но и находкой не являются. Нет репозитория или нет файла правил
  # канона — NOT-VERIFIED (exit 2), не «зелено».
  #
  # Границы названы, а не подразумеваются: страж видит ССЫЛКИ, а не файлы, —
  # правка CONSTRAINTS.yaml в рабочем дереве, не доведённая до коммита, им не
  # проверяется (дубль внутри самого файла — проверяется). Тексты правил страж не
  # сверяет: предмет — номера; «при перенумерации меняется только id» подтверждает
  # акт приёмки сличением полей правила. Страж только читает: ветвей не создаёт,
  # не удаляет и не двигает.
  - id: C-032
    name: "ADR-046 п.8: номер правила — ресурс канона — выданный незалитой ветвью номер не занят каноном (и не выдан второй ветвью)"
