# CONSTRAINTS.yaml — fitness functions кейса «laguna-compact»
# Проверка: arch-ml control check <кейс> (или fitness_check).
# Правила механические: дрейф архитектурных артефактов и классов дефектов
# Лагуны ловится без LLM.
# Связь со spine: verified_by в model/AD-*.md.
# Классификация стражей: kind ∈ behavioural|structural|documentary,
# evidence — путь/команда, по которой проверяется выполнение.
#   content-правила (must_contain/must_not_contain/each_file_must_contain) — documentary;
#   file_exists / dir_must_have_file — structural;
#   command_succeeds, проверяющий систему или артефакты прогона, — behavioural.
# Скрипты стражей создаются в walking skeleton (handoff), до него behavioural
# правила дают красный гейт по причине «инструмент отсутствует» — ожидаемо.

constraints:
  # ── Мета-контур: дисциплина решений ───────────────────────────────────────
  - id: C-001
    name: "ADR: обязательные секции (Alternatives) — решение без альтернатив не решение"
    type: each_file_must_contain
    glob: "docs/adr/*.md"
    pattern: "## Alternatives Considered"
    severity: critical
    scope: case
    kind: documentary
    evidence: "docs/adr/*.md → секция «## Alternatives Considered»"

  - id: C-002
    name: "ADR: отрицательные последствия описаны явно"
    type: each_file_must_contain
    glob: "docs/adr/*.md"
    pattern: "### Negative"
    severity: critical
    scope: case
    kind: documentary
    evidence: "docs/adr/*.md → секция «### Negative»"

  - id: C-003
    name: "ADR: обратимость указана (reversible | costly | irreversible)"
    type: each_file_must_contain
    glob: "docs/adr/*.md"
    pattern: "## Reversibility"
    severity: critical
    scope: case
    kind: documentary
    evidence: "docs/adr/*.md → секция «## Reversibility»"

  - id: C-004
    name: "Спайн: у инварианта есть проверяемое Rule"
    type: each_file_must_contain
    glob: "model/AD-*.md"
    pattern: "\\*\\*Rule\\*\\*"
    severity: critical
    scope: case
    kind: documentary
    evidence: "model/AD-*.md → поле «**Rule**»"

  - id: C-005
    name: "Спайн: инвариант привязан к fitness-правилу ИЛИ честно помечен PENDING-EVIDENCE (третьего состояния нет)"
    type: each_file_must_contain
    glob: "model/AD-*.md"
    pattern: "verified_by:\\s*\\[C-0|PENDING-EVIDENCE"
    severity: critical
    scope: case
    kind: documentary
    evidence: "model/AD-*.md → frontmatter verified_by: [C-0NN]"

  - id: C-006
    name: "Spine: заполнены Binds и Prevents (заглушка вместо инварианта недопустима)"
    type: must_contain
    glob: "ARCHITECTURE-SPINE.md"
    pattern: "\\*\\*Binds\\*\\*.*\\n.*\\*\\*Prevents\\*\\*"
    severity: critical
    scope: case
    kind: documentary
    evidence: "ARCHITECTURE-SPINE.md → пары «**Binds**»/«**Prevents**»"

  - id: C-007
    name: "Архитектурный пакет без заглушек (TODO/TBD/FIXME)"
    type: must_not_contain
    glob: "{ARCHITECTURE-SPINE.md,docs/adr/*.md,docs/specs/*.md,model/*.md}"
    pattern: "\\bTODO\\b|\\bTBD\\b|\\bFIXME\\b"
    severity: high
    scope: case
    kind: documentary
    evidence: "спайн, ADR, спеки, model/ → отсутствие TODO/TBD/FIXME"

  # ── AD-7: пересечение пулов ───────────────────────────────────────────────
  - id: C-017
    name: "AD-7: пул ревизии без задач, дословно совпадающих с SFT (0 совпадений; исходный замер — 39 пар / 8 задач, ADR-007)"
    type: command_succeeds
    command: "python3 tools/check_sft_rl_overlap.py --sft datasets/sft_train_v12.jsonl --rl runs/rev-pool/rl_pool_filtered.jsonl --max-matched 0"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_sft_rl_overlap.py → exit 0 (совпадений нет). Пул собран в S2 (коммит 27a8d40): 27 992 задачи из 28 000, исключено 8 (`explain_relation`, причины в runs/rev-pool/exclusions.json); пересечение 0. Регресс (любое совпадение) — красный"

  # ── AD-3: токенизационное пространство ────────────────────────────────────
  - id: C-008
    name: "AD-3: токен-пространство цело (8 токенов → один id) и 6 токенов формата v12 имеют ненулевые вхождения в кэше; add_special_tokens на пути претокенизации"
    type: command_succeeds
    command: "python3 tools/check_special_tokens.py --occurrences chat-format"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_special_tokens.py --occurrences chat-format → exit 0; кэш определяется приоритетом LAGUNA_TOK_CACHE → cpt_corpus_v12r_8192_qwen25.npy → первый *.npy|*.npz с печатью причины (ADR-004)"

  # ── AD-7: eval-набор без утечек ───────────────────────────────────────────
  - id: C-009
    name: "AD-7: eval-набор без утечек — slug-ответ не встречается в промпте, пересечение eval ↔ SFT/RL по нормализованному тексту пусто"
    type: command_succeeds
    command: "python3 tools/check_eval_leakage.py --eval datasets/eval_ood_clean.jsonl --train datasets/sft_train_v12.jsonl"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_eval_leakage.py → exit 0, отчёт по числу проверенных задач"

  - id: C-010
    name: "AD-7: состав CPT-микса зафиксирован карточкой с хешем корпуса"
    type: file_exists
    path: "data/corpus-card.json"
    severity: critical
    scope: case
    kind: structural
    evidence: "data/corpus-card.json → поля: source, license, chunks, tokens, sha256, mix_domain_ratio, seed"

  # ── AD-4: гигиена данных и весов ──────────────────────────────────────────
  - id: C-011
    name: "AD-4: данные и веса — только симлинками на gb10-shared (обязательный набор: datasets/, data/tok/, laguna_pipeline_v8.py, cpt_corpus_v12r.txt; отдельный манифест подключений не нужен — SSOT не дублируется)"
    type: command_succeeds
    command: "bash tools/check_symlink_hygiene.sh ."
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_symlink_hygiene.sh → exit 0 + список симлинков"

  # ── AD-2: манифест прогона ────────────────────────────────────────────────
  - id: C-012
    name: "AD-2: каждый каталог прогона несёт run_manifest.json с хешами данных, весов, пайплайна и сидом"
    type: command_succeeds
    command: "python3 tools/check_run_manifest.py --runs runs/"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_run_manifest.py → exit 0; на каждый runs/<id>/ найден run_manifest.json с dataset_sha256, base_model_id, pipeline_version, seed, stages[]"

  # ── AD-6: изоляция судьи от награды ───────────────────────────────────────
  - id: C-013
    name: "AD-6: LLM-судья не вызывается в контуре награды (изоляция по коду)"
    type: command_succeeds
    command: "python3 tools/check_judge_isolation.py --pipeline laguna_pipeline_v8.py"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_judge_isolation.py → exit 0, «judge isolated: reward path clean»"

  # ── AD-1: ось успеха и статистика сидов ───────────────────────────────────
  # История условия, без переписывания прошлых решений.
  # S3bd (решение архитектора): прежний glob `evidence/result-report-*.json` не
  # находил канонического имени файла из §5 протокола и схемы
  # (`evidence/result-report.json`, БЕЗ дефиса) — правило осталось бы красным и
  # после сдачи отчёта. Это дефект условия, а не ослабление смысла.
  # S3be (решение архитектора): правило переведено на ФАЗУ. Пустой набор файлов по
  # glob — находка движка (docs/control.md), а S4-PROTOCOL §5 запрещает создавать
  # отчёт заранее («иначе правило станет ложно зелёным»). Значит до точки S4 правило
  # было красным **по построению** — трижды разобранный класс (ADR-023 п.12),
  # который лечится фазой, а не ослаблением. По образцу C-027
  # (`check_grounded_pool.py --mode pending`): состояние «отчёта нет, потому что
  # точка решения не пройдена» названо PENDING-EVIDENCE и гейт не красит; красное
  # осталось у долга и у неполноты. `pattern`-дизъюнкция заменена **конъюнкцией**
  # обязательных полей схемы `docs/specs/result-report.schema.json` (поля берутся из
  # схемы, а не из списка в коде) — прежняя дизъюнкция считала полным отчёт, в
  # котором нашлось одно слово. Смысл сохранён: ось (`axis.metric = judge_mean`),
  # std/k-из-k (`std`, `k_of_k`, `single_seed`), `n_attempts`, анти-метрики
  # (`rl_health.entropy`, `clip_frac`, `zero_reward_share`, `hit_timeout`), вердикт.
  # Имя и severity не менялись; номер не выдавался (ADR-046 п.8). `kind` —
  # следствие смены типа на `command_succeeds` (правило стало живой проверкой, а
  # не чтением буквы в файле), а не отдельным решением.
  - id: C-014
    name: "AD-1: отчёт результата несёт ось, mean±std по сидам, k-из-k, n попыток и анти-метрики дегенерации"
    type: command_succeeds
    command: "python3 tools/check_result_report.py"
    timeout_secs: 60
    severity: high
    scope: case
    kind: behavioural
    owner: "@roman"
    evidence: "tools/check_result_report.py → exit 0 и зелёное на отчёте evidence/result-report.json, у которого выведены ВСЕ обязательные поля схемы docs/specs/result-report.schema.json (рекурсивно: axis.metric=judge_mean, axis.rl/sft/delta/exceeds_noise, single_seed, n_attempts, k_of_k, std, generation.k1/k2/domain_v3 с их полями, rl_health.entropy/clip_frac/zero_reward_share/hit_timeout, verdict, limits) и сошлись значения-константы схемы; exit 1 и поимённый список полей — если отчёт есть, но неполон (конъюнкция, а не дизъюнкция подстрок); exit 1 — если отчёта нет, а точка решения ПРОЙДЕНА (есть RL-чекпойнт runs/*/checkpoints/rl_checkpoint_final.pt, журнал runs/*/logs/rl_metrics.json или eval после RL runs/*/logs/eval_results.json): это долг, а не фаза; exit 0 со состоянием PENDING-EVIDENCE — если отчёта нет и точка решения не пройдена (фаза: отчёт создаётся только по факту замера, S4-PROTOCOL §5, и заранее созданный сделал бы правило ложно зелёным); exit 2 — NOT-VERIFIED (не прочитан корень кейса или схема). Режим --mode pending делает предметом сам PENDING (образец C-027): красное только на нём. Границы: прибор читает отчёт, а не судит решение (направление оси и различие с шумом — S4-PROTOCOL §3 и человек); замера он не делает и отчёта не создаёт. Проба цены шага run_rl_probe.py пишет rl_metrics.json в КОРЕНЬ каталога прогона — признаком пройденной точки он не считается (другой предмет, ADR-010 п.3), иначе runs/rl-probe-20260914-0956 держал бы правило красным по построению; зубы — секция 43 тестов (PENDING/PENDING-при-пробе/долг/неполный отчёт/полный по схеме)"

  # ── AD-9: хозяин ресурса GB10 ─────────────────────────────────────────────
  - id: C-018
    name: "AD-9: хозяин стенда доказан (флаг паузы, читаемый контуром лесенки, либо сторож неисполняем и его строк нет) + память по стадии + ≤1 нагрузки"
    type: command_succeeds
    command: "bash tools/check_resource_owner.sh --stage cpt --unreachable-not-verified"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_resource_owner.sh → exit 0 = CAN-START. Флаг REVISION-WINDOW.lock считается действительным только если контур лесенки его ЧИТАЕТ (обработка в restart_v12.sh); иначе при ребуте автозапуск всё равно вернёт конкурирующий прогон. Стенд недоступен → NOT-VERIFIED (не красный)"

  # ── AD-10: граница стража и раннера ───────────────────────────────────────
  - id: C-019
    name: "AD-10: гейт ссылается только на стражей (tools/check_*), но не на раннеры и билдеры"
    type: must_not_contain
    glob: "CONSTRAINTS.yaml"
    pattern: "command:\\s*\"[^\"]*tools/(run_|pilot_chain|smoke_|build_|compare_)"
    severity: high
    scope: case
    kind: documentary
    evidence: "CONSTRAINTS.yaml → ни одно правило не вызывает tools/run_*, tools/pilot_chain.sh, tools/smoke_*, tools/build_*, tools/compare_*; раннеры исполняются человеком или харнессом, обратное (раннер вызывает стража) разрешено (ADR-019, спайн AD-10)"

  # ── AD-8: лицензионный статус доменной части ─────────────────────────────
  - id: C-016
    name: "AD-8: карточка корпуса несёт лицензионный статус (internal_only); публикация производных запрещена"
    type: each_file_must_contain
    glob: "data/corpus-card.json"
    pattern: "license_status|domain_license_unresolved"
    severity: high
    scope: case
    kind: documentary
    evidence: "data/corpus-card.json → license_status: internal_only (решение владельца 14.09.2026, ADR-005); публикация артефактов за периметр — только отдельным решением владельца и новым ADR"

  # ── AD-5: ресурсный инвариант GB10 ────────────────────────────────────────
  - id: C-015
    name: "AD-5: запуск стадий на GB10 описан как последовательный и через safe_start/storm_gap"
    type: must_contain
    glob: "docs/specs/*.delta.md"
    pattern: "safe_start\\.sh|storm_gap\\.sh|mem_hygiene\\.sh"
    severity: high
    scope: case
    kind: documentary
    evidence: "docs/specs/*.delta.md → упоминание обязательных обёрток запуска"

  # ── AD-7/ADR-025: чистота измерительного набора ───────────────────────────
  - id: C-020
    name: "ADR-025 п.2: evidence PPL несёт проверку утечки — поле leak_check или ссылку leak_check_ref на проверку"
    type: each_file_must_contain
    glob: "evidence/*ppl*.json"
    exclude_glob: "evidence/ppl-baseline-v1v2.json"
    pattern: "leak_check"
    severity: critical
    scope: case
    kind: documentary
    evidence: "evidence/*ppl*.json → leak_check {dataset_sha256, overlap_docs, overlap_ngram_windows, window_size, verdict} либо leak_check_ref на каноническую проверку (evidence/calib-protocol-audit.json: v1 — 0 документов, 0 общих 12-граммовых окон из 36 464 649). Причина правила: потолок PPL (ADR-022 п.3) — единственный абсолютный критерий валидности CPT-стадии, и он ничего не значит, если набор оказался текстом обучения (ADR-025: general_eval_v2 — 200/200 документов в источнике реплея v12r50). Исключение: база S3h (evidence/ppl-baseline-v1v2.json) — её sha256 прибит в 6 артефактах (baseline_source.sha256 в s3m-ppl-arms.json + reference_sha256 в пяти отчётах рук), и правка метаданных разорвала бы привязку числа к версии файла (ADR-011 п.4, ADR-023 п.7). Чистота базы покрыта той же канонической проверкой — через leak_check_ref файлов рук"
  # ── AD-2/AD-12: карточка обучающего набора SFT (дыра G3 плана стадии) ─────
  # Зачем правило, а не «документ в дереве»: набор SFT — такой же версионируемый
  # конфиг, как CPT-микс (AD-7), и без карточки нечем доказать, что обучение шло
  # на том же файле. Отдельно от C-012 (манифест прогона): манифест доказывает
  # тождество ОДНОГО прогона, карточка — предмета стадии.
  #
  # Переномеровано при сведении ветвей (20.09.2026): в ветке
  # arch/laguna-control-arms эти два правила были выданы локальным счётом как
  # C-020/C-021 и столкнулись с занятыми номерами канона — C-020 (leak_check,
  # ADR-025 п.2) и C-021 (предложение AD-12, docs/specs/HANDOFF-CONTRACT-PROPOSAL.md);
  # C-022 зарезервирован за стражем agentic-доли (ADR-035 п.5). Номер выдаёт канон
  # (ADR-046 п.2), поэтому правила ветки уезжают на следующие свободные номера,
  # тексты правил не меняются. Ссылки «C-020/C-021» в артефактах стадии SFT
  # (evidence/s3aa-sft-launch.json, runs/sft-20260916-2246/HANDOFF.md) означают
  # эти два правила и как исторический факт не переписываются (ADR-028 п.4).
  # ── AD-13 / C-022: агентный критерий стадии (ADR-033 п.2в) ──────────────────
  # Номер зарезервирован за стражем agentic-доли (ADR-035 п.5) — правило выдано
  # здесь. ADR-059: база критерия — ПЕРЕСНЯТАЯ в штатном режиме (входной чекпойнт
  # стадии), а не замороженная цитата ADR-033: та снята в legacy-режиме декодирования
  # и в вердикт не входит (ADR-028 п.4 — цитату не переписываем).
  #
  # Правило зовёт ОБЁРТКУ `tools/check_agentic_criterion.py`, а не стража напрямую:
  # стражу обязательны `--report` и `--base-report`, поэтому прямой вызов дал бы
  # красное на любом дереве без артефактов — «красный по построению», запрещённый
  # ADR-053. Обёртка различает состояния предмета: нет ни одного артефакта → exit 2
  # (NOT-VERIFIED, фаза «ещё не может быть»); есть ровно один → exit 1 (неполнота —
  # нарушение); оба есть → **проброс кода стража как есть** (0 — сопоставимо, 1 —
  # нарушение сопоставимости). Обёртка ничего не решает по существу: метрику не
  # считает и вердикт не подменяет — вердикт по (в1)/(в2) остаётся у сводки
  # (ADR-059 п.5). Дельта правила и реестр номеров разделов тестов —
  # docs/specs/C-022-PHASED.md §2.
  - id: C-022
    name: "ADR-059: агентная база критерия (в) — переснятая и сопоставимая с отчётом (правило с фазой: предмета нет — NOT-VERIFIED, а не красное)"
    type: command_succeeds
    command: "python3 tools/check_agentic_criterion.py"
    severity: critical
    scope: case
    kind: behavioural
    evidence: "tools/check_agentic_criterion.py → exit 0 (база и отчёт сопоставимы: штатный режим декодирования у обоих, флаги без форсирования и без подсказки тега, предметы разные (вход/выход стадии) со сверкой с распиской брони RECEIPT.json при наличии, sha256 пулов и n совпадают), 1 (нарушение: неполный предмет либо отказ стража — режим не штатный, смена флагов, совпавшие/недоказанные предметы, расхождение пулов или n), 2 (NOT-VERIFIED: артефактов ещё нет — фаза «ещё не может быть», ADR-053). Носитель правила сопоставимости — tools/check_sft_agentic_share.py (ADR-059 п.3), обёртка берёт его семантику импортом и пробрасывает код; расхождение с цитатой ADR-033 — примечание warn (ADR-059 п.4, цитата не переписывается)"

  - id: C-023
    name: "AD-2/AD-12: обучающий набор SFT зафиксирован карточкой (G3 плана стадии)"
    type: file_exists
    path: "data/sft-card-v12.json"
    severity: high
    scope: case
    kind: structural
    evidence: "data/sft-card-v12.json → path, size, sha256_full, composition, format_shares, duplicates, tokens_cache, license"

  - id: C-024
    name: "AD-2/AD-12: карточка SFT несёт ПОЛНЫЙ хеш набора и долю дубликатов с эквивалентом эпох (обратная сторона дефекта N5: хеш по первым 1 МиБ тождества не доказывает)"
    type: each_file_must_contain
    glob: "data/sft-card-v12.json"
    pattern: "sha256_full|duplicates_share_pct|effective_passes"
