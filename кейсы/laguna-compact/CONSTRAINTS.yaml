  # ── AD-9: запрет сна во время GPU-нагрузки ────────────────────────────────
  # Зачем правило, а не «инструмент в дереве». Обвязка `tools/guard_cuda_run.sh`
  # (запрет сна `systemd-inhibit --what=sleep --mode=block`, предполётная проверка
  # устройства драйверным `cuInit`, расписка о устройстве/Xid/дошедших пробах) была
  # написана 21.09.2026 по следам инцидента, но **ни один запуск её не применял**:
  # защита держалась на памяти человека, а обход не оставлял следа. Правило
  # превращает «не рекомендовано» в находку — тем же способом, что C-025 сделал
  # для стража реестра приборов (страж, живущий только в тестах, гейтом не является).
  #
  # Класс риска тот же, что у C-018 (AD-9): ресурс достаётся нагрузке, которая может
  # быть уничтожена извне. Только там внешний конкурент — чужой прогон, а здесь —
  # сон машины: 21.09.2026 в 05:03:37 хост ушёл в S3, в 05:03:44 ядро записало
  # `Xid 31` (MMU fault) по процессу прогона, в 05:03:46 прогон V3 умер с
  # `cudaErrorLaunchFailure` на 24-й пробе из 104, и устройство после этого не
  # поднялось вовсе (`cuInit` → 999). Числа прогона при этом недействительны, а
  # «нет отчёта» читается как «не мерили».
  #
  # Что проверяется механически (два источника, оба — факт, а не декларация):
  #   (а) живые нагрузки: процесс объявленного набора (`GPU_LOADS`) ищется в таблице
  #       процессов локальной площадки (`/proc`) и стенда (`ps` через ssh, только
  #       чтение) и обязан иметь действующий запрет сна — предка
  #       `systemd-inhibit --what=…sleep… --mode=block` в цепочке PPid либо метку
  #       `CUDA_SLEEP_GUARD=1` в окружении (её ставит обвязка полезной нагрузке).
  #       `--mode=delay` защитой не считается: на машине такие держатели есть всегда
  #       (GNOME держит `sleep` в режиме `delay`), и принимать их за механизм значило
  #       бы объявить защитой намерение;
  #   (б) доказательства запрета у начатых прогонов: каталог прогона, начатый после
  #       вступления правила в силу (21.09.2026), обязан нести либо расписку обвязки
  #       `runs/<run>/guard*.json` с `sleep_inhibit.held = true`, либо запрет в
  #       **записанной команде** прогона (`chain_command.txt`/`launch_command.txt`) —
  #       так стартует отсоединённая стадия SFT (`tmux` + `setsid nohup`), и запрет
  #       стоит в самой команде, потому что вокруг запускающего её `ssh` он не жил бы
  #       ни секунды. Страж называет, какой носитель сработал, и предел второго назван
  #       честно: это документ (AD-2), исполнение по нему подтверждает живая проверка
  #       (а), пока прогон идёт. Прогоны, начатые раньше, находкой не являются и
  #       называются историческими (ADR-028 п.4: история не переписывается) — но
  #       перечисляются, чтобы «историческое» не читалось как «проверенное». Отказ
  #       обвязки до старта (`payload = null`) — тоже не находка: GPU-работы не было,
  #       и это названо распиской, а не умолчанием. А вот расписка, которая сама
  #       говорит, что нагрузка шла **без** запрета (`sleep_inhibit.held` не true, а
  #       `payload` есть), — находка: «расписка есть» не значит «запрет был».
  #   Шум, который правило knowingly допускает, назван в шапке стража: вызов
  #   инструмента объявленного набора на подставном входе (так делает тестовый
  #   харнесс кейса) тоже читается находкой — физический признак работы на
  #   устройстве (fd `/dev/nvidia*`) на стенде невидим, потому что нагрузка идёт
  #   внутри контейнера от root, а имя и режим работают на обеих площадках.
  #   Выбрано сознательно: находка видна поимённо (pid и командная строка), а
  #   пропущенная нагрузка невидима.
  #
  #   (в) механизм на каждой площадке измеряется, а не предполагается: страж сам
  #       проверяет, берётся ли `systemd-inhibit --what=sleep --mode=block` (локально —
  #       вызовом, на стенде — тем же вызовом через ssh). Это не формальность: на
  #       `gb10-fast` 21.09.2026 механизм **недоступен** — `Failed to inhibit: Access
  #       denied` (у пользователя нет logind-сессии, ssh-сессии закрыты).
  #
  #   (г) **второй способ доказать защиту** (дельта `sleep-guard-masked-stand`,
  #       21.09.2026): площадка защищена, если выполнено **любое** из двух — инхибит
  #       берётся (в) **либо** сон структурно недостижим: все четыре цели
  #       (`sleep`/`suspend`/`hibernate`/`hybrid-sleep`) отдают `is-enabled = masked`,
  #       и **попытка старта `suspend.target` проваливается** с причиной о маскировке.
  #       Второе доказывается попыткой, а не чтением флага (тот же принцип, что у
  #       стража egress: пытаемся выйти и требуем отказа), и попытка не может усыпить
  #       площадку по построению — она делается только после того, как все четыре цели
  #       прочитаны `masked`. Так защищён стенд: `gb10-fast` 21.09.2026 —
  #       `systemd-inhibit` не берётся, зато `/etc/systemd/system/{sleep,suspend,
  #       hibernate,hybrid-sleep}.target → /dev/null` (переживает перезагрузку),
  #       и `sudo -n systemctl start suspend.target` → `Unit suspend.target is
  #       masked.`. Прежде такая площадка отдавалась блокером, и старт стадии на ней
  #       был невозможен, хотя фактическая защита там сильнее инхибита.
  #       Площадка, **измеренная** и не защищённая ни одним из двух способов, —
  #       блокер и **находка** (exit 1), а не предупреждение: «не измерено» (ssh не
  #       ответил, механизм не спрошен) остаётся NOT-VERIFIED, потому что это разные
  #       утверждения. Способ называется поимённо: расписка без имени способа
  #       (`protection: inhibit | masked_targets`) доказательством не считается, а
  #       маскировка без провала попытки — тем более.
  #
  # Границы правила названы, а не подразумеваются. Прибор `tools/probe_language_split.py`
  # пиннут хешем (`99dafa8d…`, ADR-041): правка его тела сломала бы сопоставимость
  # чисел стадии, поэтому отказать в старте изнутри он не может — обход ловится
  # живьём (а) и отсутствием расписки (б). Раннер `tools/launch_sft_stage.py` для
  # `--do launch|all` отказывается стартовать без доказанной защиты (exit 2), то
  # есть для него обход невозможен, а не только виден; защиту цепочки держит шаг
  # `tools/chain_sleep_guard.sh` в записанной команде — он решает на площадке
  # прогона, каким из двух способов защищаться, и отказывает закрыто, если ни один
  # не доказан. Стенд покрыт отдельной площадкой: `--host` читает его таблицу
  # процессов, недоступный стенд — NOT-VERIFIED, а не «зелено».
  - id: C-029
    name: "AD-9: во время GPU-нагрузки кейса запрет сна действует (живая нагрузка без запрета и прогон после момента вступления правила в силу (2026-09-21 14:22:35 MSK) без расписки обвязки — находка)"
    type: command_succeeds
    command: "python3 tools/check_gpu_sleep_guard.py --host gb10-fast --unreachable-not-verified"
    timeout_secs: 120
    severity: critical
