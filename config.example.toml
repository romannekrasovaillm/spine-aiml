# -----------------------------------------------------------------------------
# Управление компьютером и браузером через vision (ADR-041).
# Наблюдение включено всегда и живёт в ядре: screenshot, read_image,
# screen_size, window_list — видеть экран безопасно.
# ВОЗДЕЙСТВИЕ (мышь/клавиатура/браузер) по умолчанию выключено: клик и ввод
# необратимы и видны за пределами харнесса. Даже при enabled = true инструменты
# класса Destructive отклоняются на R2 и требуют подтверждения на R4 — поднимать
# автономию осознанно ([policy] autonomy = "R5" снимает подтверждение).
# Требуется X11-сессия и xdotool: sudo apt install xdotool.
# Координаты computer_* — нормализованные 0–1000 по каждой оси от кадра
# (не пиксели): провайдер ужимает изображение перед инференсом, поэтому
# пиксельная шкала модели к экрану не привязана.
# -----------------------------------------------------------------------------
[computer]
enabled = false                       # инструменты computer_* и window_focus не регистрируются при false
input_backend = ""                    # xdotool | "" — автодетект (Wayland-бэкенды в этой ревизии не поддержаны)
key_delay_ms = 12                     # задержка между символами при наборе текста (xdotool type --delay)
max_clicks = 3                        # потолок повторов в одном клике/скролле — тормоз против runaway-цикла
timeout_secs = 10                     # таймаут одного вызова инструмента ввода

# Браузерный контур: запуск Chrome с выделенным профилем и управление через CDP.
# Харнесс НИКОГДА не подключается к вашему профилю с логинами — user_data_dir
# создаётся внутри state_dir. Отладочный порт слушает только 127.0.0.1.
# CDP-хелпер (assets/computer/cdp.mjs) требует Node.js >= 18.
[computer.browser]
enabled = false                       # инструменты browser_* не регистрируются при false
browser_bin = ""                      # "" — автодетект: google-chrome → chromium → chromium-browser → firefox → xdg-open
node_bin = "node"                     # исполняемый файл Node.js для CDP-хелпера
headless = false                      # --headless=new вместо окна
debug_port = 9222                     # отладочный порт CDP (только loopback)
user_data_dir = ""                    # "" — state_dir/computer/chrome-profile
timeout_secs = 30                     # таймаут одного вызова CDP-хелпера

# -----------------------------------------------------------------------------
# Archify — контур диаграмм «архитектура как код» (JSON IR → HTML/SVG):
# инструменты archify_validate/archify_deliver/archify_compare и
# CLI `arch-ml archify …`. Личные пути — только здесь, не в коде.
# cli_path пуст — интеграция не настроена: инструменты ответят инструкцией.
# Движок вендорен в монорепозитории: cli_path = "<клон>/vendor/archify/bin/archify.mjs"
# (zero-dependency рантайм, node_modules не нужен — vendor/README.md).
# Альтернатива: npx skills add tt-a1i/archify -g или git clone upstream.
# Методика авторинга IR — плагин ru-archify (скилл archify-diagrams).
# -----------------------------------------------------------------------------
[archify]
enabled = true                      # false — archify_* не регистрируются в сессии
cli_path = ""                       # напр. "/home/user/spine-bank/vendor/archify/bin/archify.mjs"
node_bin = "node"                   # Node.js >=18
timeout_secs = 120                  # потолок одного вызова CLI (compare — до 900)

# -----------------------------------------------------------------------------
# Кодовые харнессы — адаптеры запуска внешних агентов реализации.
# prompt_mode: positional (промпт — аргумент) | flag ({prompt} в args) | stdin.
# handoff-пакет кладётся в <repo>/.arch-handoff/ командой `arch-ml handoff`.
# Умные таймауты: timeout_secs — абсолютный потолок; idle_timeout_secs —
# таймаут тишины (нет вывода И нет изменений файлов репо — прогон завис и
# прерывается; молча работающий харнесс не трогаем, 0 — выключить). При любом
# прерывании убивается вся процессная группа (TERM→KILL): сирот не остаётся,
# частичный вывод возвращается в сводку.
# auto_commit: после успешного прогона незакоммиченные правки исполнителя
# фиксируются коммитом харнесса (кроме .arch-handoff/ и мусора __pycache__/
# *.pyc/.pytest_cache/) — контракт TASK.md требует финального коммита от
# исполнителя, а это страховка: результат всегда оказывается в git.
#
# Транспорт ACP (ADR-049, docs/harness_integrations.md): для харнессов с
# поддержкой Agent Client Protocol v1 (проверено: `kimi acp`) —
# transport = "acp" (prompt_mode не применяется, задача уходит протоколом):
# живой ход прогона в логе (tool-вызовы, план, usage), детерминированные
# ответы на разрешения (acp_permission: readonly_auto (дефолт) | deny |
# allow_all), продолжение контекста между прогонами — по имени-алиасу
# acp_session (без него каждый прогон открывает СВЕЖУЮ сессию; алиас —
# «возобновить-или-создать», карта state/acp-sessions.json).
# -----------------------------------------------------------------------------
[harnesses.claude-code]
binary = "claude"
# --dangerously-skip-permissions обязателен для headless: иначе `claude -p`
# встаёт на permission-промпте файловых операций и висит до таймаута.
# Уберите флаг, если прогоны интерактивные.
args = ["-p", "--dangerously-skip-permissions"]
prompt_mode = "stdin"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true
# Whitelist наследуемого окружения (по умолчанию наследуется всё; непустой
# список — чистое окружение + перечисленное + env адаптера):
# env_allow = ["PATH", "HOME", "LANG", "TERM", "TMPDIR",
#              "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY",
#              "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL"]

[harnesses.qwen-code]
binary = "qwen"
# qwen без -p запускает ИНТЕРАКТИВНЫЙ CLI: дефолтная подкоманда — `qwen`
# («Launch Qwen Code [default]»), а справка прямо говорит «use -p/--prompt for
# non-interactive mode». args = [] + stdin здесь НЕ headless.
args = ["-p", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.openclaw]
binary = "openclaw"
# openclaw требует явный выбор сессии: --agent main; иначе код 1.
args = ["agent", "--agent", "main", "--message", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.hermes]
binary = "hermes"
# hermes: задача передаётся флагом -z PROMPT; stdin-режима нет (код 2 на -p).
args = ["-z", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.theseus]
binary = "theseus"
# theseus: -p PROMPT (flag-режим); "run --task" устарело — код 2.
args = ["-p", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.codewhale]
binary = "codewhale"
# codewhale: неинтерактивный путь — подкоманда `exec` («Run a non-interactive
# prompt») с `--auto` («tool-backed agent mode with auto-approvals»); пример
# из её же справки: codewhale exec --auto "list crates/ with ls".
# Верхнеуровневый `-p` описания не имеет, а верхнеуровневый запуск — сессия
# интерактивная (проверка прогоном: scripts/adapters-headless-check.sh).
args = ["exec", "--auto", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

[harnesses.kimi-code]
binary = "kimi"
# kimi: -p PROMPT (flag-режим). Permission-флаг НЕ нужен и недопустим:
# в `-p`-режиме regular-инструменты всегда под auto-политикой, а
# --yolo/--auto с --prompt несовместимы (запуск отклоняется). Модель
# исполнителя — добавьте в args: "-m", "<alias>".
args = ["-p", "{prompt}"]
prompt_mode = "flag"
timeout_secs = 1800
idle_timeout_secs = 600
auto_commit = true

# ACP-вариант kimi (ADR-049): живой ход прогона в логе (tool/plan/usage),
# продолжение контекста по алиасу. Раскомментируйте при необходимости.
# [harnesses.kimi-acp]
# binary = "kimi"
# args = ["acp"]
# transport = "acp"
# # acp_session = "reviewer"     # без алиаса — каждый прогон свежая сессия
# # acp_permission = "readonly_auto"
# timeout_secs = 1800
# idle_timeout_secs = 600
# auto_commit = true

# -----------------------------------------------------------------------------
# MCP: файл серверов в формате Claude Code (см. examples/mcp.example.json).
# `arch-ml init` кладёт образец в ~/.arch-ml/mcp.json.
# -----------------------------------------------------------------------------
[mcp]
servers_file = "~/.arch-ml/mcp.json"
connect_on_start = false              # false — ленивое подключение по первому вызову
timeout_secs = 60

# -----------------------------------------------------------------------------
# Политика автономии инструментов (R-уровни, AI-Disrupt PDLC): автономия
# калибруется риском действия, а не брендом модели. Проверка — в dispatch
# каждого инструмента; решения журналируются в сессии.
# -----------------------------------------------------------------------------
[policy]
autonomy = "R2"   # R0 только чтения | R2 +изменения (дефолт) | R4 деструктив с подтверждением | R5 полная (красный флаг аудита)

# -----------------------------------------------------------------------------
# Флот прогонов кодовых харнессов: enforced-изоляция и гейт интеграции
# (мотив — AI-native SDLC playbook Anthropic: «агент не аппрувит свой код
# и не имеет пути в main» — enforced платформой, а не дисциплиной промптов).
# require_worktree = true: harness_run / arch harness-run идут в изолированном
# git worktree (ветка arch/<харнесс>-<timestamp>), основное дерево не
# трогается; handoff-пакет .arch-handoff/ копируется в worktree автоматически.
# Интеграция результата — `arch fleet merge <run-id>`: при merge_gate = "owner"
# без --owner-approve печатается сводка (diff stat, коммиты, статус контракта
# из лога-evidence) и мерж отклоняется (exit 1) — решение принимает владелец.
# -----------------------------------------------------------------------------
[fleet]
require_worktree = false   # true — прогоны харнессов только в git worktree
merge_gate = "owner"       # owner — мерж с --owner-approve | none — без гейта
capacity_per_agent = 1     # ёмкость харнесса для роутера (шт. items на агента)
# --- Планы флота (ADR-042): движок оркестрации по паттернам ---
# Паттерн (fanout|pipeline|map_reduce|tournament|review_pair|ralph|
# walking_skeleton|dag) компилируется в граф узлов и исполняется волнами;
# гейты узла механические (контракт/fitness/линт спайна/delta guard), мерж —
# только `arch-ml fleet merge <run-id> --owner-approve`.
plan_dir = ".arch-fleet"   # каталог планов в репозитории (fleet plan propose)
max_parallel = 8           # потолок ОДНОВРЕМЕННЫХ процессов плана (пул):
                           # сотни узлов в плане — да, процессов — сколько разрешено
stop_on_gate_fail = false  # true — отказ гейта узла останавливает волны (canary)
budget_max_node_secs = 0   # потолок времени одного узла, сек (0 — без лимита)
budget_max_attempts = 0    # потолок суммарных попыток прогона (0 — без лимита)
# Baseline-судья гейтов (ADR-046): путь к бинарю arch-ml, собранному ДО прогона.
# Команда гейта вида "./target/debug/arch-ml control check ." исполняется им, а
# не бинарём внутри ворктри узла (самооценка); при его отсутствии такая команда
# падает. Приоритет — у флага `fleet run --judge`; если ни флага, ни поля нет,
# берётся бинарь, запустивший флот.
# judge_binary = "/opt/arch-ml/bin/arch-ml"

# -----------------------------------------------------------------------------
# Локальные GPU харнесса ([[gpus.local]]): своё железо, $0 аренды — первым в
# очереди на прогон, облако (vast.ai) — замыкающим (arch-ml resources recommend).
# device — ключ реестра (arch-ml resources list): gb10=128 unified, rtx4080super=16,
# rtx4090=24, rtx5090=32, rtx6000ada/a6000=48, a100/h100=80. vram_gb — необязательное
# переопределение (иначе из реестра). ssh — алиас Host из ~/.ssh/config для удалённого
# GPU (read-only nvidia-smi, детекция в arch-ml resources check); пусто — GPU на этой машине.
# -----------------------------------------------------------------------------
[[gpus.local]]
name = "gb10"            # DGX Spark, unified 128 ГБ, headless (отдельная машина)
device = "gb10"
ssh = "gb10-fast"        # Host-алиас в ~/.ssh/config (прямой 10GbE, 10.55.0.2)

[[gpus.local]]
name = "rtx4080super"    # дискретная 16 ГБ (эта машина)
device = "rtx4080super"

# -----------------------------------------------------------------------------
# Изоляция окружения bash-команд (defensive pattern DeepSeek Harness:
# недоверенному выводу — не ambient-окружение). Из окружения процесса,
# порождённого инструментом bash, выбрасываются переменные с
# секретоподобными именами (токены имени KEY/SECRET/TOKEN/PASSWORD/PASSWD/
# PASS/CREDENTIAL(S)/AUTH): DEEPSEEK_API_KEY, GH_TOKEN, SSH_AUTH_SOCK и т.п.
# не видны команде, которую написала модель. env_allow — точные имена-
# исключения, пропускаемые несмотря на scrub (понадобятся, если рабочему
# контуру нужен, например, GH_TOKEN для `gh`).
# sandbox — изоляция дочерних команд (ADR-038): "none" (дефолт, поведение
# прежних версий) | "bwrap" (bubblewrap: рабочее дерево rw, остальная ФС
# read-only, --unshare-net — сети у дочерних процессов нет). Требует пакет
# bubblewrap и разрешённые unprivileged user namespaces; bwrap задан, но не
# найден в PATH — команда НЕ выполняется (fail-safe, не молчаливый откат).
# Неизвестное значение — ошибка конфига при загрузке.
# -----------------------------------------------------------------------------
[bash]
env_scrub = true
env_allow = []      # пример: ["GH_TOKEN"]
sandbox = "none"    # "bwrap" — изоляция bubblewrap (банк-профиль)

# -----------------------------------------------------------------------------
# Плагины (открытый стандарт agent-plugins.org): пакеты «скиллы + MCP».
# Каждый прямой потомок каталога — плагин: plugin.json + skills/<name>/SKILL.md
# + mcp.json/.mcp.json (+ agents/, hooks/ как клиентские расширения).
# Первый каталог — локальная библиотека (arch-ml init кладёт туда arch-core и
# плагины паттернов), второй — общая библиотека скиллов пользователя.
# -----------------------------------------------------------------------------
[plugins]
dirs = [
    "~/.arch-ml/plugins",
    # "~/knowledge/skills",   # раскомментируйте и укажите свою библиотеку плагинов
]
include_mcp = true   # MCP-серверы из плагинов (имена plugin.server) попадают в общий пул
include_hooks = true # хуки плагинов (hooks/hooks.json) исполняются в сессиях;
                     # false — только для недоверенных библиотек

# -----------------------------------------------------------------------------
# Планировщик md-задач (см. cron.example.toml).
# out_dir не задан — отчёты пишутся в <reports_dir>/cron.
# -----------------------------------------------------------------------------
[cron]
file = "~/.arch-ml/cron.toml"
# out_dir = "~/.arch-ml/reports/cron"

# -----------------------------------------------------------------------------
# Goal-режим — контроль-петля автопродолжения (спека aiml/notes/goal-mode.md).
# Цель ставится слэш-командой `/goal <цель> || <критерий> || <проверка>` или
# флагом `arch-ml run --goal "…"`; после каждого терна хост проверяет критерий
# механически (check, exit 0) и, пока цель жива, вставляет в конец контекста
# синтетическое user-сообщение с целью (recency). Здесь — только ограничители
# петли: состояние самой цели живёт в сессии и журнале, не в конфиге.
# -----------------------------------------------------------------------------
[goal]
# Максимум continuation-тернов одной цели: страховка от бесконечной петли
# (каждый терн — полноценный вызов модели). По исчерпании — пауза.
max_continuations = 50
# Бюджет токенов прогона: при достижении — автопауза. Не задан — без лимита
# (в статистике напоминания счётчик всё равно виден модели).
# token_budget = 2000000
# Таймаут механической проверки критерия (команда `check`), секунды.
check_timeout_secs = 60
# Сколько повторов ОДНОГО блокера переводят цель в `blocked` (спека §4).
blocker_repeats = 3
# Сколько тернов подряд без нового вывода ведут к автопаузе.
no_progress_turns = 3

# -----------------------------------------------------------------------------
# Пути к ассетам и данным. assets_dir: prompts/, rubrics/, benchmarks/, ascii/
# (раскладываются `arch-ml init` из встроенных). sessions — append-only журналы.
# -----------------------------------------------------------------------------
[paths]
assets_dir = "~/.arch-ml/assets"
reports_dir = "~/.arch-ml/reports"
sessions_dir = "~/.arch-ml/sessions"
state_dir = "~/.arch-ml/state"      # персистентное состояние: failure_memory.json,
                                         # failure_lessons.md (см. [agent] failure_memory)
memory_file = "~/.arch-ml/MEMORY.md"  # глобальная md-память: дописывается
                                           # в системный промпт каждой сессии
                                           # (см. /memory и `arch-ml memory`)

# -----------------------------------------------------------------------------
# Оформление TUI. Значения ниже — дефолты; CLI-флаги (--theme, --no-color,
# --ascii, --no-mouse, --no-animation) важнее этого раздела.
#
#   theme      auto | dark | light. auto — по фону терминала (COLORFGBG),
#              иначе тёмная. light — палитра Tokyo Night Day.
#   mouse      Захватывать ли мышь: колесо, выделение драгом, кнопка «▼».
#              Выключено — выделение текста делает сам терминал (Shift+drag).
#   animation  Спиннер и «дыхание» мыслей. Выключено — статичные кадры: для
#              ssh и медленных соединений (автоматически выключается по ssh).
#   unicode    Unicode-рамки и глифы. Выключено — ASCII-фолбэк (`+-|`, `|/-\`):
#              для LANG=C, старого conhost и части ssh-клиентов.
#   min_width  Минимальный размер окна: меньше — заглушка «Терминал мал»
#   min_height с текущим и требуемым размером, вместо каши из панелей.
# -----------------------------------------------------------------------------
[tui]
theme = "auto"   # auto | dark | light | high-contrast (без цвета и dim, bold/reverse)
mouse = true
animation = true
unicode = true
min_width = 60
min_height = 16
