# =============================================================================
# arch-ml — пример конфигурации (config.toml)
# =============================================================================
# Порядок поиска конфига при запуске:
#   1. --config <path>
#   2. ./arch-ml.toml (текущий каталог)
#   3. ~/.config/arch-ml/config.toml
#   4. встроенные дефолты (этот файл их документирует полностью)
#
# Все секции опциональны (serde default) — указывайте только отличия.
# Тильда `~/` в путях раскрывается при загрузке (knowledge dirs, mcp/cron/paths).
# API-ключи НЕ пишутся в конфиг — только имена переменных окружения.
# =============================================================================

# Модель по умолчанию — ключ из секции [models.*].
default_model = "deepseek"

# -----------------------------------------------------------------------------
# LLM-провайдеры (OpenAI-совместимые endpoint'ы).
# api_key_env — имя переменной окружения с ключом (значение ключа не хранится!).
# temperature: не задана = провайдерский дефолт (поле просто опускается).
#
# thinking_on / thinking_off — карты ризонинга (JSON-объект, сливается в тело
# запроса при `/think on|off` в TUI или `arch-ml run --think on|off`):
#   DeepSeek V4, GLM-4.x:  thinking = { type = "enabled" | "disabled" }
#   Kimi K3:               reasoning_effort = "max" | "low"  (выключить нельзя)
# Без `/think` карты не шлются — действует дефолт провайдера (у DeepSeek V4
# ризонинг по умолчанию ВКЛЮЧЁН с effort=high). Для thinking + tools DeepSeek
# требует эха reasoning_content — харнесс хранит его и возвращает сам.
#
# proxy — опциональный URL прокси для провайдера (напр. регионально
# заблокированный API через локальный egress-шлюз):
#   proxy = "http://127.0.0.1:12080"
# Для loopback-прокси (127.0.0.1/localhost) харнесс при выборе модели сам
# проверяет порт и поднимает шлюз (`systemctl --user start vpn-egress`);
# недоступность шлюза — предупреждение, запрос идёт дальше. Внешний прокси
# используется как есть. Без поля — прямое соединение (или env HTTP(S)_PROXY).
#
# Актуальность id моделей сверена с официальной документацией (август 2026):
# deepseek-chat/reasoner сняты 2026-07-24 → deepseek-flash/v4-pro (v4-flash выведена);
# kimi-k2 снят 2025-05-25 → kimi-k3; glm-4.6 → glm-4.7.
# -----------------------------------------------------------------------------
[models.deepseek]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"              # быстрая модель для повседневных задач
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 8192
timeout_secs = 180
context_limit = 1000000
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.deepseek-pro]
base_url = "https://api.deepseek.com/v1"
model = "deepseek-v4-pro"             # тяжёлый ризонинг: состязательное ревью, гейты
api_key_env = "DEEPSEEK_API_KEY"
max_tokens = 8192
timeout_secs = 300                    # pro думает дольше — бюджет тишины выше
context_limit = 1000000
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.kimi]
# Официальная coding-поверхность Kimi Code (доки kimi.com/code): модели
# k3 / k3-256k; старая /v1 отдаёт 404, api.moonshot.ai душится DPI (флапает).
# Thinking-параметры поверхность не принимает (K3 ризонит всегда); temperature
# — только 1 (поэтому не шлём). Ключ: env KIMI_API_KEY или файл api_key_file.
base_url = "https://api.kimi.com/coding/v1"
model = "k3"                          # флагман Kimi Code, 256k контекст
api_key_env = "KIMI_API_KEY"
api_key_file = "~/.kimi_api_key"      # запасной путь, если env не задан
max_tokens = 8192
timeout_secs = 180
context_limit = 1000000

[models.glm]
# Международная площадка Z.AI (ключ ZHIPU_API_KEY с docs.z.ai — тот же
# аккаунт работает и на китайском open.bigmodel.cn). Для Китая —
# base_url = "https://open.bigmodel.cn/api/paas/v4".
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-5.2"                     # флагман Z.AI, 1M контекст (резервный провайдер)
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 180
context_limit = 1000000
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

# ── GigaChat (ADR-021) ─────────────────────────────────────────────
# OAuth2 вместо статического ключа: Basic-ключ из api_key_env/api_key_file
# идёт на {oauth.token_url} (RqUID uuid4, form scope=…), далее Bearer с
# упреждающим рефрешем (за 60 с до expires_at, TTL 30 мин). User-Agent
# обязателен (без него 403) — дефолт "spine-arch/<version>".
# thinking в API нет — thinking_on/off НЕ задавать. Контекст 128K.
[models.gigachat]
# base_url не задан → пресет https://api.giga.chat/v1
model = "GigaChat-2-Pro"
api_key_env = "GIGACHAT_API_KEY"    # Authorization-key из кабинета Сбера
max_tokens = 8192
timeout_secs = 180
context_limit = 128000
# TLS: серверный сертификат — НУЦ Минцифры; раскомментируйте и укажите
# PEM корня (AD-BE5: без ослаблений проверки, verify=false запрещён):
# ca_pem_file = "/etc/spine/certs/russian-trusted-root-ca.pem"
[models.gigachat.oauth]
token_url = "https://ngw.devices.sberbank.ru:9443/api/v2/oauth"  # дефолт фабрики, можно опустить
scope = "GIGACHAT_API_PERS"       # PERS | B2B | CORP — выбор владельца инсталляции

[models.gigachat-max]
# Флагман линейки GigaChat-2; тот же OAuth-профиль, бюджет тишины выше.
model = "GigaChat-2-Max"
api_key_env = "GIGACHAT_API_KEY"
max_tokens = 8192
timeout_secs = 300
context_limit = 128000
[models.gigachat-max.oauth]
scope = "GIGACHAT_API_PERS"

[models.gigachat-ultra]
# GigaChat-3-Ultra: только физлица (Freemium; платные тарифы и юрлица —
# недоступна, developers.sber.ru/docs/ru/gigachat/models/gigachat-3-ultra).
# Согласуется со scope PERS; при CORP/B2B ключе вернёт ошибку доступа.
model = "GigaChat-3-Ultra"
api_key_env = "GIGACHAT_API_KEY"
max_tokens = 8192
timeout_secs = 300
context_limit = 128000
[models.gigachat-ultra.oauth]
scope = "GIGACHAT_API_PERS"
#
# Корпоративный ключ (юрлица): скопируйте любую секцию gigachat* под новым
# именем и замените api_key_env и scope — личный и корпоративный ключи
# будут жить в пикере одновременно (у юрлиц 10 одновременных потоков):
# [models.gigachat-corp-max]
# model = "GigaChat-2-Max"
# api_key_env = "GIGACHAT_API_KEY_CORP"
# max_tokens = 8192
# timeout_secs = 300
# context_limit = 128000
# [models.gigachat-corp-max.oauth]
# scope = "GIGACHAT_API_CORP"       # CORP | B2B — по типу корпоративного ключа
#
# B2Bank-профиль (банковский контур, домен sbrf.ru): mTLS клиентским
# сертификатом, БЕЗ OAuth (секция oauth отсутствует, Bearer не шлётся);
# base_url задаёт инсталляция (IFT/пром стенд):
# [models."gigachat-b2bank"]
# base_url = "https://gigachat.ift.sbrf.ru/v1"   # пример, адрес — у владельца стенда
# model = "GigaChat-2-Pro"
# client_cert_file = "/etc/spine/certs/client.pem"
# client_key_file  = "/etc/spine/certs/client-key.pem"
# max_tokens = 8192
# timeout_secs = 180

[models."glm-4.7"]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-4.7"                     # прошлое поколение: дешевле флагмана вдвое
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 180
context_limit = 204800
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.glm-air]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-4.5-air"                 # дешёвый рабочий (~$0.14/$0.86 за 1М)
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 120
context_limit = 131072
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

[models.glm-flash]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-4.7-flash"               # бесплатный тариф: черновики, крон, дайджесты
api_key_env = "ZHIPU_API_KEY"
max_tokens = 8192
timeout_secs = 120
context_limit = 204800
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "disabled" } }

# GLM-5.3-Flash: окно 1.3M, вывод до 128K. thinking НЕ отключается
# (HTTP 1210 на thinking.type=disabled) — «off» эмулируется enabled + low.
[models."glm-5.3-flash"]
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-5.3-flash"
api_key_env = "ZHIPU_API_KEY"
timeout_secs = 180
context_limit = 1310720
thinking_on  = { thinking = { type = "enabled" } }
thinking_off = { thinking = { type = "enabled" }, reasoning_effort = "low" }

# Провайдер за egress-прокси (напр. регионально заблокированный API).
# Поле proxy нацеливает HTTP-клиент этого провайдера на локальный шлюз;
# loopback-шлюз харнесс поднимает сам при выборе модели — ручной `source
# env.sh` перед запуском не нужен:
# [models.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# model = "vendor/model"
# api_key_env = "OPENROUTER_API_KEY"
# proxy = "http://127.0.0.1:12080"      # локальный egress-шлюз (vpn-egress)

# -----------------------------------------------------------------------------
# Агентный цикл «модель ↔ инструменты».
# -----------------------------------------------------------------------------
[agent]
max_tool_turns = 4800                 # максимум итераций за один ход (по исчерпании — финальный ответ без инструментов; петли ловят детекторы)
context_budget_tokens = 6000000       # потолок бюджета контекста; авто-компактификация работает от
                                      # min(этого бюджета, context_limit модели): L1-маскирование на 70%,
                                      # L3-саммари на 95% окна модели; принудительно — /compact в TUI
stream = true                         # стримить дельты ответа в TUI/stdout
failure_memory = "propose"            # память сбоев инструментов («ошибся дважды → урок»):
                                      # off — выкл; propose — заметка в чат + предложение урока в
                                      # state/failure_lessons.md (/lessons); write — как propose +
                                      # append урока в AGENTS.md проекта (вне зоны ARCH:GENERATED)
images_keep_last = 1                  # сколько последних кадров уходит в запрос к модели остальные
                                      # снимаются из запроса с пометкой (тело запроса иначе растёт
                                      # линейно от числа скриншотов; у DeepSeek лимит 48 MiB).
                                      # Для vision-сценариев «до/после» (сравнение двух кадров
                                      # одним взглядом) поднимите до 2+: при 1 предыдущий кадр
                                      # вытесняется до следующего запроса.

# -----------------------------------------------------------------------------
# LLM-судья рубрик (ADR-004): калибровка и верификация оценок.
# Каждый критерий оценивается samples независимыми прогонами судьи; итоговый
# балл — медиана, разброс σ выше unstable_stdev помечается `unstable`.
# Балл ≥ 2 обязан опираться на цитату из оцениваемого текста; цитата слабее
# evidence_min_similarity → `evidence_not_found`, критерий исключается из
# взвешенного итога. golden_max_mae — порог `arch-ml bench run --golden`:
# итоговый MAE выше порога → exit code 1 (регрессионный гейт).
# -----------------------------------------------------------------------------
[judge]
samples = 3                           # сэмплов судьи на критерий (1 — одиночная оценка)
unstable_stdev = 1.0                  # порог population-σ сэмплов для метки unstable
evidence_min_similarity = 0.8         # fuzzy-порог подтверждения цитаты (0..=1; точное вхождение — всегда)
golden_max_mae = 1.0                  # максимальный MAE golden-прогона (в баллах шкалы)

# -----------------------------------------------------------------------------
# Локальная база знаний для `arch-ml kb` и инструмента kb_search.
# Каталоги — доменные документы архитектора (разборы, концепты, скиллы);
# принцип Context Supply Chain: сужайте до релевантных доменов, не «вся Wiki».
# -----------------------------------------------------------------------------
[knowledge]
dirs = [
  "~/knowledge/architecture",      # разборы и статьи (ЗАМЕНИТЕ на свои каталоги)
  "~/knowledge/papers",            # научные статьи/концепты
  "~/knowledge/skills",            # ваша библиотека скиллов
]
extensions = ["md", "txt", "rst"]     # какие расширения индексировать

# -----------------------------------------------------------------------------
# Веб-доступ: поиск (DuckDuckGo HTML), фетч страниц, кураторские сайты.
# Кураторский список используется `arch-ml web search --arch` и инструментом
# web_arch_sites: версии технологий проверяются по первоисточникам, не по памяти.
# -----------------------------------------------------------------------------
[web]
enabled = true                     # false — полное выключение веб-инструментов (контур банка, AD-BE5); по умолчанию true
search_base = "https://html.duckduckgo.com/html/"
user_agent = "arch-ml/0.1 (+solution-architect harness)"
timeout_secs = 30
max_fetch_chars = 24000               # усечение текста страницы после html→text

[[web.arch_sites]]
name = "aws-arch"
